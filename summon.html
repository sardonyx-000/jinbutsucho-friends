<script>const CharacterStore=(()=>{
 const key='jinbutsucho_stable_v1_characters';
 let dbPromise;
 function db(){return dbPromise ||= new Promise((resolve,reject)=>{const r=indexedDB.open('jinbutsucho-character-storage',1);r.onupgradeneeded=()=>r.result.createObjectStore('archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('保存領域が使用中です'));});}

 return {load,write};
})();

ck',function(e){\\n  if(typeof parent.openCardImagePicker!=='function')return;\\n  e.preventDefault();e.stopImmediatePropagation();\\n  parent.openCardImagePicker(kind);\\n },true);\\n});\\n\\n(function(){\\n let lastHeight=0;\\n function sendHeight(){\\n  const main=document.querySelector('main');\\n  if(!main)return;\\n  const h=Math.ceil(main.getBoundingClientRect().bottom+16);\\n  if(h>200&&Math.abs(h-lastHeight)>3){\\n   lastHeight=h;\\n   parent.postMessage({type:'jinbutsucho-card-editor-height',height:h},'*');\\n  }\\n }\\n addEventListener('load',()=>{sendHeight();setTimeout(sendHeight,300);setTimeout(sendHeight,1200)});\\n const main=document.querySelector('main');\\n if(main&&'ResizeObserver' in window)new ResizeObserver(sendHeight).observe(main);\\n addEventListener('resize',sendHeight);\\n})();;\\n\u003c/script>\u003c/body>\u003c/html>\";\nconst ritualHtml=\"\\u003c!doctype html>\\u003chtml lang=\\\"ja\\\">\\u003chead>\\u003cmeta charset=\\\"utf-8\\\">\\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1,viewport-fit=cover\\\">\\u003ctitle>人物帖 | 旧き印の炎 DELUXE — 加速回転・線を伝う自然燃焼\\u003c/title>\\u003cstyle>\\n:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f3e6d3;background:#090909}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#281a1b,#08090b 70%)}.app{max-width:470px;margin:auto;padding:14px 12px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.kicker{font:10px monospace;letter-spacing:.24em;color:#dca875}h1{font-size:19px;margin:5px 0}.pill{font:10px monospace;border:1px solid #725345;border-radius:30px;padding:8px;color:#c9a17c}.stage{height:min(72dvh,690px);min-height:470px;position:relative;overflow:hidden;isolation:isolate;border:1px solid #72513c;border-radius:13px;background:radial-gradient(ellipse at 50% 44%,#3c191b 0%,#120e12 43%,#06080a 80%);box-shadow:0 20px 60px #000c}.stage:before{content:\\\"\\\";position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(0deg,transparent 0 3px,#f5ba7d13 4px 5px);pointer-events:none;z-index:14}.stage:after{content:\\\"\\\";position:absolute;inset:0;box-shadow:inset 0 0 110px #000;pointer-events:none;z-index:16}.canvas{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}#flames{z-index:6;mix-blend-mode:screen}.ambient{position:absolute;inset:-20%;background:radial-gradient(circle,#d15d2233,transparent 55%);opacity:0;z-index:1}.sigilwrap{position:absolute;width:min(108%,490px);aspect-ratio:1;top:44%;left:50%;transform:translate(-50%,-50%) scale(.5) rotate(-35deg);opacity:0;z-index:5;filter:drop-shadow(0 0 8px #ff6b27)}.sigil{width:100%;height:100%;overflow:visible}.glyph{fill:none;stroke:#caa36b;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);filter:drop-shadow(0 0 2px #e8aa5e)}.glyph.major{stroke-width:2.1}.glyph.eye{stroke:#ffcb80;stroke-width:2.4}.ringA,.ringB,.ringC{transform-origin:200px 200px}.figurewrap{position:absolute;z-index:8;inset:10% 0 9%;display:flex;align-items:end;justify-content:center;opacity:0;transform:translateY(35px) scale(.84);filter:brightness(0) drop-shadow(0 0 30px #e46b2c)}.figurewrap img{max-width:94%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 18px #f3a65a66)}.placeholder{width:70%;height:92%;background:linear-gradient(140deg,#aa6b44,#37252e 48%,#111318);clip-path:polygon(43% 2%,57% 2%,66% 10%,67% 25%,59% 35%,75% 40%,87% 82%,76% 100%,20% 100%,12% 82%,24% 40%,41% 35%,32% 25%,33% 10%);filter:drop-shadow(0 0 30px #d4734a)}.floor{position:absolute;bottom:4%;left:5%;width:90%;height:19%;background:radial-gradient(ellipse,#e76b2755,transparent 65%);opacity:0;z-index:3}.light{position:absolute;left:50%;top:47%;width:12%;height:130%;transform:translate(-50%,-50%) scaleX(.1);background:linear-gradient(90deg,transparent,#ffe7a5a8 40%,#fff8dc 50%,#ffe7a5a8 60%,transparent);filter:blur(8px);opacity:0;z-index:7}.burst{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 45%,#fff6d8,#ff9a4c 20%,#bd392255 43%,transparent 66%);opacity:0;z-index:11;pointer-events:none}.eyeoverlay{position:absolute;top:44%;left:50%;width:80px;height:43px;transform:translate(-50%,-50%) scale(.5);border:2px solid #ffe2a5;border-radius:50% 10% 50% 10%;rotate:45deg;opacity:0;z-index:12;box-shadow:0 0 30px #f80}.eyeoverlay:after{content:\\\"\\\";position:absolute;left:33%;top:18%;width:26px;height:26px;border-radius:50%;background:#fff3ca;box-shadow:0 0 30px #ffb42e}.nameplate{position:absolute;bottom:6%;width:100%;text-align:center;z-index:15;opacity:0;transform:translateY(25px);text-shadow:0 2px 15px #000}.nameplate .sub{font:10px monospace;letter-spacing:.3em;color:#f4b77d}.nameplate h2{font-size:clamp(27px,7vw,37px);margin:7px 0;letter-spacing:.14em}.nameplate p{font-size:12px;color:#e0c7ae;margin:0}.corner{position:absolute;z-index:17;font:9px monospace;letter-spacing:.14em;color:#b98762}.corner.a{top:16px;left:15px}.corner.b{bottom:14px;right:13px}.status{font:11px monospace;letter-spacing:.12em;text-align:center;color:#d9b189;margin:10px 0}.buttons{display:flex;gap:8px;margin-top:11px}button,.upload{border:1px solid #8a6048;border-radius:9px;background:#201819;color:#f6e4cf;padding:13px 10px;font:inherit;cursor:pointer}.buttons button{flex:1}button.primary{background:#d4a26b;color:#21120e;font-weight:800}.settings{margin-top:13px;border:1px solid #4a3931;border-radius:12px;padding:12px;display:grid;gap:10px}.settings label{font-size:12px;color:#d5b9a0}.settings input[type=text]{width:100%;padding:11px;border:1px solid #695044;background:#120f12;color:white;border-radius:7px;font:inherit}.upload{display:block;text-align:center;font-size:12px}.upload input{display:none}.note{font-size:11px;line-height:1.7;color:#bba99d;margin-top:10px}.stage.play .ambient{animation:ambient 7s both}.stage.play .sigilwrap{animation:appear 1.3s .2s both,implode 1s 5.0s both}.stage.play .glyph{animation:trace 1.25s var(--delay) ease-out both,burn 1.3s calc(var(--delay) + 2.25s) ease-in both}.stage.play .glyph.eye{animation:trace 1.1s 1.65s both,eyeburn 1.35s 4.25s both}.stage.play .ringA{animation:accelerateA 5.15s 1s linear both}.stage.play .ringB{animation:accelerateB 5.15s 1s linear both}.stage.play .ringC{animation:accelerateC 5.15s 1s linear both}.stage.play .light{animation:beam 1.15s 5.45s both}.stage.play .burst{animation:blast 1.15s 5.8s both}.stage.play .figurewrap{animation:reveal 1.5s 6.1s both}.stage.play .floor{animation:floor .9s 5.7s both}.stage.play .nameplate{animation:namereveal .9s 7.1s both}.stage.play .eyeoverlay{animation:eyeflash .7s 4.9s both}@keyframes ambient{10%,90%{opacity:1}100%{opacity:.45}}@keyframes appear{to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}@keyframes implode{0%{opacity:1}100%{opacity:0;filter:brightness(4) blur(12px);transform:translate(-50%,-50%) scale(1.5) rotate(18deg)}}@keyframes trace{to{stroke-dashoffset:0}}@keyframes burn{0%{stroke:#f5bd75;stroke-dashoffset:0;filter:drop-shadow(0 0 3px #f60)}35%{stroke:#fff0c6;filter:drop-shadow(0 0 12px #ff6d00)}65%{stroke:#ff581e;filter:drop-shadow(0 0 15px #f40)}100%{stroke:#332c2b;stroke-dashoffset:var(--len);opacity:0;filter:blur(3px)}}@keyframes eyeburn{0%{stroke-dashoffset:0}45%{stroke:#fff;filter:drop-shadow(0 0 18px #ff4500)}100%{opacity:0;stroke-dashoffset:var(--len)}}@keyframes accelerateA{0%{transform:rotate(0deg)}20%{transform:rotate(25deg)}40%{transform:rotate(100deg)}60%{transform:rotate(280deg)}80%{transform:rotate(660deg)}100%{transform:rotate(1320deg)}}@keyframes accelerateB{0%{transform:rotate(0deg)}20%{transform:rotate(-35deg)}40%{transform:rotate(-145deg)}60%{transform:rotate(-410deg)}80%{transform:rotate(-970deg)}100%{transform:rotate(-1890deg)}}@keyframes accelerateC{0%{transform:rotate(0deg)}20%{transform:rotate(45deg)}40%{transform:rotate(190deg)}60%{transform:rotate(540deg)}80%{transform:rotate(1260deg)}100%{transform:rotate(2520deg)}}@keyframes beam{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.1)}50%{opacity:1;transform:translate(-50%,-50%) scaleX(3)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(12)}}@keyframes blast{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(2)}}@keyframes reveal{0%{opacity:0;transform:translateY(40px) scale(.82);filter:brightness(0) drop-shadow(0 0 30px #f80)}45%{opacity:1;filter:brightness(3) drop-shadow(0 0 40px #f80)}100%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}@keyframes floor{to{opacity:1}}@keyframes namereveal{to{opacity:1;transform:translateY(0)}}@keyframes eyeflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}@media(prefers-reduced-motion:reduce){.stage.play .sigilwrap{display:none}.stage.play .figurewrap,.stage.play .nameplate{animation-duration:.1s;animation-delay:.2s}}\\n\\nhtml,body{height:100%;overflow:hidden;background:#07080a}.app{padding:0;max-width:none;height:100%;display:block}.top,.controls,.note,.actions,.hint,.footer{display:none!important}.stage{width:100vw;height:100dvh;min-height:0;max-height:none;border:0;border-radius:0}.figurewrap,.nameplate{display:block}\\n\\u003c/style>\\u003c/head>\\u003cbody>\\u003cmain class=\\\"app\\\">\\u003cdiv class=\\\"top\\\">\\u003cdiv>\\u003cdiv class=\\\"kicker\\\">PERSONAL ARCHIVE / SUMMON PROTOCOL\\u003c/div>\\u003ch1>旧き印の炎 \\u003cspan style=\\\"font-size:11px;color:#c9956a\\\">DELUXE\\u003c/span>\\u003c/h1>\\u003c/div>\\u003cdiv class=\\\"pill\\\">ELDER SEAL\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"stage\\\" id=\\\"stage\\\">\\u003cdiv class=\\\"ambient\\\">\\u003c/div>\\u003cdiv class=\\\"corner a\\\">RITUAL SEQUENCE // 07\\u003c/div>\\u003cdiv class=\\\"corner b\\\">ARCHIVE // UNSEALED\\u003c/div>\\u003ccanvas class=\\\"canvas\\\" id=\\\"flames\\\">\\u003c/canvas>\\u003ccanvas class=\\\"canvas\\\" id=\\\"particles\\\">\\u003c/canvas>\\u003cdiv class=\\\"floor\\\">\\u003c/div>\\u003cdiv class=\\\"sigilwrap\\\">\\u003csvg class=\\\"sigil\\\" viewBox=\\\"0 0 400 400\\\" id=\\\"sigil\\\" aria-label=\\\"五芒星と眼の幾何学的な召喚陣\\\">\\u003cg class=\\\"ringA\\\">\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"184\\\"/>\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"175\\\"/>\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"166\\\"/>\\u003cpath class=\\\"glyph\\\" d=\\\"M200 16V34 M200 366V384 M16 200H34 M366 200H384 M70 70l15 15 M315 315l15 15 M70 330l15 -15 M315 85l15 -15\\\"/>\\u003c/g>\\u003cg class=\\\"ringB\\\">\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"152\\\"/>\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"138\\\"/>\\u003cpath class=\\\"glyph\\\" d=\\\"M200 48L332 276L68 276Z M200 352L68 124L332 124Z\\\"/>\\u003c/g>\\u003cg class=\\\"ringC\\\">\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"119\\\"/>\\u003cpath class=\\\"glyph major\\\" d=\\\"M200 89 L265.2 289.5 L94.5 165.5 L305.5 165.5 L134.8 289.5 Z\\\"/>\\u003cpath class=\\\"glyph\\\" d=\\\"M200 102L287 263L112 263Z M200 298L112 137L287 137Z\\\"/>\\u003c/g>\\u003cg>\\u003ccircle class=\\\"glyph\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"78\\\"/>\\u003cpath class=\\\"glyph eye\\\" d=\\\"M134 200 Q200 138 266 200 Q200 262 134 200Z\\\"/>\\u003ccircle class=\\\"glyph eye\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"25\\\"/>\\u003ccircle class=\\\"glyph eye\\\" cx=\\\"200\\\" cy=\\\"200\\\" r=\\\"10\\\"/>\\u003cpath class=\\\"glyph eye\\\" d=\\\"M200 147V158 M200 242V253 M128 200H140 M260 200H272\\\"/>\\u003c/g>\\u003c/svg>\\u003c/div>\\u003cdiv class=\\\"eyeoverlay\\\">\\u003c/div>\\u003cdiv class=\\\"light\\\">\\u003c/div>\\u003cdiv class=\\\"figurewrap\\\" id=\\\"figure\\\">\\u003cdiv class=\\\"placeholder\\\" id=\\\"placeholder\\\">\\u003c/div>\\u003cimg id=\\\"portrait\\\" alt=\\\"探索者の立ち絵\\\" hidden>\\u003c/div>\\u003cdiv class=\\\"burst\\\">\\u003c/div>\\u003cdiv class=\\\"nameplate\\\">\\u003cdiv class=\\\"sub\\\">INVESTIGATOR MANIFESTED\\u003c/div>\\u003ch2 id=\\\"displayName\\\">UNKNOWN\\u003c/h2>\\u003cp id=\\\"displayTitle\\\">封印された記録が、いま解かれる。\\u003c/p>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"status\\\" id=\\\"status\\\">READY // TAP TO INITIATE\\u003c/div>\\u003cdiv class=\\\"buttons\\\">\\u003cbutton class=\\\"primary\\\" id=\\\"play\\\">✦ 召喚を開始\\u003c/button>\\u003cbutton id=\\\"skip\\\">スキップ\\u003c/button>\\u003c/div>\\u003cdiv class=\\\"settings\\\">\\u003clabel>探索者名\\u003cinput type=\\\"text\\\" id=\\\"name\\\" value=\\\"探索者の名前\\\" maxlength=\\\"30\\\">\\u003c/label>\\u003clabel>称号・紹介文\\u003cinput type=\\\"text\\\" id=\\\"title\\\" value=\\\"封印された記録が、いま解かれる。\\\" maxlength=\\\"80\\\">\\u003c/label>\\u003clabel class=\\\"upload\\\">＋ 立ち絵PNGを選択（端末内でプレビュー）\\u003cinput type=\\\"file\\\" id=\\\"file\\\" accept=\\\"image/png,image/webp,image/jpeg\\\">\\u003c/label>\\u003c/div>\\u003cp class=\\\"note\\\">独立した演出試作版です。人物帖の保存データは変更しません。立ち絵はこのページ内でのみ読み込み、アップロードされません。NFC連携・人物帖連動は未実装です。音声なしで再生できます。魔法陣の線を火が走り、燃えた箇所から小さな炎と灰が生まれます。\\u003c/p>\\u003c/main>\\u003cscript>\\nconst stage=document.getElementById('stage'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),flameCanvas=document.getElementById('flames'),fx=flameCanvas.getContext('2d');let particles=[],start=0,raf=0,playing=false;const glyphs=[...document.querySelectorAll('.glyph')];glyphs.forEach((el,i)=>{let len=el.getTotalLength?.()||1000;el.style.setProperty('--len',len);el.style.setProperty('--delay',(0.35+i*.105)+'s')});let W=0,H=0,dpr=1;function resize(){let r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);flameCanvas.width=W*dpr;flameCanvas.height=H*dpr;fx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();\\n// SVG path geometry is sampled in screen space, so flames remain attached\\n// to the actual rotating lines rather than appearing at random positions.\\nconst paths=glyphs.map((el,i)=>({el,i,len:el.getTotalLength(),delay:el.classList.contains('eye')?1.65:.35+i*.105,eye:el.classList.contains('eye')}));\\nlet flames=[],lastT=0;\\nfunction pointOnPath(item,fraction){\\n  const p=item.el.getPointAtLength(Math.max(0,Math.min(item.len,item.len*fraction)));\\n  const m=item.el.getScreenCTM(),rect=flameCanvas.getBoundingClientRect();\\n  if(!m)return null;\\n  return {x:m.a*p.x+m.c*p.y+m.e-rect.left,y:m.b*p.x+m.d*p.y+m.f-rect.top};\\n}\\nfunction makeFlame(x,y,tangentX,tangentY,power=1){\\n const n=Math.hypot(tangentX,tangentY)||1;\\n const dx=tangentX/n,dy=tangentY/n;\\n flames.push({x,y,vx:dx*(.2+Math.random()*.5)+(Math.random()-.5)*.35,\\n vy:-.65-Math.random()*.65,life:15+Math.random()*15,max:30,\\n size:(2+Math.random()*3)*power,phase:Math.random()*6.28});\\n}\\nfunction fire(t){\\n fx.clearRect(0,0,W,H);\\n if(t\\u003c1.4||t>6.45){flames=[];return}\\n fx.save();fx.globalCompositeOperation='lighter';\\n // A thin ignition front moves along each individual stroke.\\n for(const item of paths){\\n   const ignition=item.eye?4.25:item.delay+2.25;\\n   const duration=item.eye?1.35:1.3;\\n   const progress=(t-ignition)/duration;\\n   if(progress\\u003c0||progress>1.08)continue;\\n   const front=Math.max(0,Math.min(1,progress));\\n   const p=pointOnPath(item,front);\\n   if(!p)continue;\\n   const prev=pointOnPath(item,Math.max(0,front-.015))||p;\\n   // Bright hot tip clings to the line.\\n   const halo=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,12);\\n   halo.addColorStop(0,'rgba(255,255,224,.9)');\\n   halo.addColorStop(.22,'rgba(255,180,65,.72)');\\n   halo.addColorStop(1,'rgba(255,70,15,0)');\\n   fx.fillStyle=halo;fx.beginPath();fx.arc(p.x,p.y,12,0,Math.PI*2);fx.fill();\\n   // Short flames trail the ignition front, rather than random flames everywhere.\\n   for(let j=0;j\\u003c3;j++){\\n     const q=pointOnPath(item,Math.max(0,front-j*.025));\\n     if(q&&Math.random()\\u003c.65)makeFlame(q.x,q.y,p.x-prev.x,p.y-prev.y,j===0?1.2:.75);\\n   }\\n   if(Math.random()\\u003c.8)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*1.3,vy:-.4-Math.random()*1.4,life:25+Math.random()*35,max:60,size:.25+Math.random()*.7,ash:false,color:Math.random()\\u003c.5?'#ffb35c':'#ff6c25'});\\n   if(progress>.42&&Math.random()\\u003c.35){\\n     const ashP=pointOnPath(item,Math.random()*front);\\n     if(ashP)particles.push({x:ashP.x,y:ashP.y,vx:(Math.random()-.5)*.9,vy:-.15-Math.random()*.5,life:35+Math.random()*45,max:80,size:.3+Math.random()*.7,ash:true,color:'#938b83'});\\n   }\\n }\\n flames=flames.filter(f=>f.life-->0);\\n for(const f of flames){\\n   f.x+=f.vx;f.y+=f.vy;f.vx+=Math.sin(t*9+f.phase)*.055;\\n   const alpha=Math.min(1,f.life/10)*Math.min(1,(f.max-f.life)/5);\\n   const h=f.size*(2.4+Math.sin(t*12+f.phase)*.35);\\n   const grad=fx.createLinearGradient(f.x,f.y,f.x+f.vx*3,f.y-h);\\n   grad.addColorStop(0,`rgba(255,240,166,${.85*alpha})`);\\n   grad.addColorStop(.4,`rgba(255,117,24,${.8*alpha})`);\\n   grad.addColorStop(1,'rgba(190,25,5,0)');\\n   fx.fillStyle=grad;\\n   fx.beginPath();fx.moveTo(f.x-f.size*.48,f.y);\\n   fx.quadraticCurveTo(f.x-f.size*.7,f.y-h*.55,f.x+f.vx*3,f.y-h);\\n   fx.quadraticCurveTo(f.x+f.size*.7,f.y-h*.48,f.x+f.size*.48,f.y);\\n   fx.closePath();fx.fill();\\n }\\n fx.restore();\\n}\\nfunction spawn(t){\\n // Small ambient embers, with no unrelated large tongues of flame.\\n const count=t>2.5&&t\\u003c6.3?2:0;\\n for(let i=0;i\\u003ccount;i++){\\n   const item=paths[Math.floor(Math.random()*paths.length)];\\n   const p=pointOnPath(item,Math.random());\\n   if(!p)continue;\\n   particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*.5,vy:-.4-Math.random()*.7,life:28+Math.random()*35,max:65,size:.25+Math.random()*.55,ash:t>4.3,color:t>4.3?'#968b80':'#e68b44'});\\n }\\n}\\nfunction frame(ts){if(!playing)return;let t=(ts-start)/1000;ctx.clearRect(0,0,W,H);fire(t);if(t\\u003c7)spawn
