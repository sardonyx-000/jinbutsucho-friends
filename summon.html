<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人物帖｜召喚から紹介まで通し試作</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a10;color:#f1e5d3;font-family:system-ui,sans-serif}
#editor{width:100%;height:100dvh;min-height:500px;border:0;display:block}
#backupBar{position:fixed;z-index:41;top:max(8px,env(safe-area-inset-top));right:8px;display:flex;gap:6px}

#summonEdit{position:fixed;z-index:40;bottom:max(8px,env(safe-area-inset-bottom));right:10px;left:10px;max-width:510px;margin:auto;background:#171821f5;border:1px solid #b48b58;border-radius:16px;padding:11px 14px;box-shadow:0 8px 30px #000a}
#summonCanvas{width:min(100%,220px);aspect-ratio:9/16;margin:12px auto 0;position:relative;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(circle at 50% 52%,#4b3326,#100d14 70%);border:1px solid #b68c55;border-radius:9px}

#summonRing span{font-size:12px;letter-spacing:8px}
#summonArt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transform-origin:center bottom;pointer-events:none;display:none}
#summonPlaceholder{position:absolute;top:45%;width:100%;text-align:center;font-size:11px;padding:8px;color:#dbc3a6;pointer-events:none}
#summonCanvasLabel{position:absolute;bottom:5px;left:5px;right:5px;background:#0a0b12cc;border-radius:5px;text-align:center;padding:6px;font-size:10px;pointer-events:none}
#summonEdit[open]{max-height:86dvh;overflow-y:auto}
#summonEdit summary{cursor:pointer;font-weight:700;font-size:14px;color:#f1d4a6}
#summonEdit .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:14px 0}
#summonEdit label{display:block;font-size:12px;color:#e3d7c4}
#summonEdit output{float:right;color:#e9b870}
#summonEdit input{display:block;width:100%;margin:8px 0;accent-color:#d8a35c}
.summonActions{display:flex;gap:8px}.summonActions button{flex:1;padding:10px 6px;background:#332a24;color:#ffe2ba;border:1px solid #ad8151;border-radius:9px;font-size:12px}
#summonEdit small{display:block;color:#aaa;margin-top:8px}
#experience{position:fixed;inset:0;z-index:999;display:none;background:#07070b}
#experience.on{display:block}#experience.on #ritual{background:radial-gradient(circle at 50% 45%,#201421,#07070b 75%)}
#ritual{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .75s ease}
#ritual.fade{opacity:0;pointer-events:none}
#touchSurface{position:absolute;inset:0;z-index:5;touch-action:none;display:none;user-select:none;-webkit-user-select:none}
#touchSurface.active{display:block}
#touchSurface:after{content:"指で移動・2本指で拡大縮小";position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;color:#ffdda8;font:12px system-ui;background:#101018aa;padding:7px 10px;border-radius:9px;pointer-events:none}
#cardview{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(1.08);transition:opacity .9s ease,transform 1.15s ease;pointer-events:none}
#cardview.on{opacity:1;transform:scale(1);pointer-events:auto}
#overlayControls{position:absolute;z-index:10;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;justify-content:center;opacity:0;transition:opacity .4s}
#overlayControls.on{opacity:1}
#overlayControls button,#skipIntro{background:#161922d9;color:#f1dfbd;border:1px solid #b18a5c;border-radius:999px;padding:11px 16px;font:13px system-ui,sans-serif}
#nextScene{position:absolute;z-index:11;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:90%;padding:14px 22px;border-radius:999px;background:#15151bde;border:1px solid #c99c5d;color:#fff1d9;font:14px system-ui;display:none;box-shadow:0 0 22px #e4a24b55;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 36px #e4a24baa}}#skipIntro{position:absolute;right:12px;top:max(14px,env(safe-area-inset-top));z-index:12}
 .summonExtra{margin-top:14px;padding:12px;border:1px solid #7c6045;border-radius:10px;background:#15141b}.summonExtra h3{font-size:14px;margin:12px 0}.summonExtra select{display:block;width:100%;margin-top:7px;padding:9px;color:#fff;background:#282430;border:1px solid #866749;border-radius:8px}.summonExtra input[type=color]{height:40px;padding:2px;background:transparent;border:0}.colorInfo{font-size:12px;color:#d6c1a5;line-height:1.7}.extraButton{width:100%;padding:11px;background:#433327;border:1px solid #ac8556;border-radius:8px;color:#ffdfaa}.raritySample{text-align:center;padding:20px 8px;font-size:30px;font-weight:bold;letter-spacing:.15em;animation:rarityRise .8s ease-out both}@keyframes rarityRise{from{opacity:0;transform:scale(.65);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}#revealRarity{position:absolute;bottom:18%;left:0;right:0;z-index:20;text-align:center;font-size:clamp(22px,7vw,40px);font-weight:800;letter-spacing:.14em;pointer-events:none;opacity:0;text-shadow:0 0 22px currentColor}#revealRarity.on{animation:rarityRise 1s ease-out forwards} </style><style>
#editTopNav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}#editTopNav .archive-name{font-size:13px;color:#e8cfa9;font-weight:700}
#editTabBar{position:sticky;top:0;z-index:45;background:#101116;padding:9px 10px;display:flex;gap:7px;border-bottom:1px solid #80654a}
#editTabBar button{flex:1;min-width:0;border:1px solid #766049;border-radius:9px;background:#28232a;color:#e7d8c5;padding:12px 5px;font-size:12px}
#editTabBar button.active{background:#8b683d;color:white;font-weight:bold}
.editPanel{display:none;max-width:760px;margin:0 auto;padding:12px 14px 120px}.editPanel.active{display:block}
#cardSettings #editor{width:100%;height:680px;min-height:0;display:block;border:0;overflow:hidden}#editor.edit-hidden{display:none}
#magicEditPreview{width:100%;height:360px;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;border:1px solid #7b5b43;border-radius:12px;background:radial-gradient(circle,#26192a,#08090d 73%)}
#magicSettings .summonExtra{margin-top:12px}#sceneSettings #summonEdit{position:static;max-width:unset;max-height:none;overflow:visible;margin:0;padding:12px;box-shadow:none}#sceneSettings #summonEdit>summary{display:none}#sceneSettings #summonEdit[open]{max-height:none}
#magicSettings .summonExtra h3:nth-of-type(2),#magicSettings .summonExtra #rarityInfo,#magicSettings .summonExtra #testRarity,#magicSettings .summonExtra #raritySample{display:none}
#sceneSettings .raritySection{background:#171821;border:1px solid #b48b58;border-radius:12px;padding:12px;margin:12px 0}
#sceneSettings .raritySection input[type=color]{height:38px;width:100%}
#editFullPreview{margin:8px 10px 4px;width:calc(100% - 20px);padding:12px;border:1px solid #bc925c;border-radius:10px;background:#60462d;color:#fff3dd;font-weight:700}
#sceneSettings .summonActions{margin-top:10px}

#sceneSettings #summonCanvas{position:relative;isolation:isolate}
#sceneNameStars{position:absolute;inset:auto 3% 6%;z-index:9;pointer-events:none;text-align:center;display:flex;align-items:center;justify-content:center;min-height:75px}
#sceneNameStars #nameStarPreviewGroup{width:100%;padding:5px 8px;background:linear-gradient(transparent,#08070a66,transparent)}
#sceneSettings #scenePreviewTry{display:block;width:100%;margin:10px 0 4px}
#summonCanvas.scenePreviewPlaying #sceneNameStars{animation:sceneNameReveal 1.5s ease both}
#summonCanvas.scenePreviewPlaying #summonArt{animation:scenePortraitReveal 1.5s ease both}
@keyframes sceneNameReveal{0%{opacity:0;filter:blur(10px);scale:.85}65%{opacity:.8}100%{opacity:1;filter:none;scale:1}}
@keyframes scenePortraitReveal{0%{opacity:.2;filter:brightness(2) blur(9px)}100%{opacity:1;filter:none}}

/* 召喚画面: ラベルとスライダーを1項目ずつ縦に整理 */
#sceneSettings .raritySection .typographyControls,
#sceneSettings .raritySection .typographyColors{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:18px 0}
#sceneSettings .raritySection .typographyControls>label,
#sceneSettings .raritySection .typographyColors>label{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0;font-size:15px;line-height:1.55;color:#e9dfd0}
#sceneSettings .raritySection .typographyControls output{display:inline;font-size:14px;color:#dcae70}
#sceneSettings .raritySection input[type=range]{display:block;width:100%;max-width:100%;box-sizing:border-box;margin:4px 0 8px;accent-color:#d9a45f}
#sceneSettings .raritySection input[type=color]{display:block;box-sizing:border-box;width:100%;margin:0;min-height:44px}
#sceneSettings .raritySection select{display:block;width:100%;box-sizing:border-box;margin:0!important;min-height:44px}
#sceneSettings .raritySection #starCount{width:100%;margin:8px 0}
#sceneSettings .raritySection h3{margin:0 0 14px;line-height:1.5}
#sceneSettings .raritySection .colorInfo{line-height:1.75;margin:0 0 16px}
#sceneSettings .raritySection #resetNameStars{margin-top:8px;width:100%}

/* Keep preview visible while scrolling through independent, collapsible controls. */
#sceneSettings{padding-top:8px}
#scenePreviewDock{position:sticky;top:64px;z-index:20;background:#101116f7;border:1px solid #80654a;border-radius:12px;padding:6px 10px 8px;box-shadow:0 5px 18px #0009;display:flex;flex-direction:column;align-items:center}
#scenePreviewCaption{font-size:11px;color:#ddc5a4;text-align:center;margin:2px 0 4px}
#scenePreviewDock #summonCanvas{width:min(100%,clamp(130px,23dvh,210px));margin:0 auto;flex:none}
#scenePreviewDock #scenePreviewTry{margin:6px 0 0;padding:8px 12px;min-height:35px}
#scenePreviewDock>.colorInfo{display:none}
#sceneSettings #summonEdit{margin-top:10px;max-width:none}
#sceneSettings #summonEdit>summary{display:list-item;cursor:pointer;font-size:15px;padding:6px 2px}
#sceneSettings #summonEdit:not([open]){padding:10px 14px}
#sceneTypeDetails{margin-top:10px;border:1px solid #b48b58;border-radius:12px;background:#171821;padding:10px}
#sceneTypeDetails>summary{cursor:pointer;color:#f1d4a6;font-size:15px;font-weight:700;padding:6px}
#sceneTypeDetails>.raritySection{border:0;margin:4px 0;padding:6px 0;background:transparent}
#sceneNameStars{min-height:0}
#sceneNameStars #nameStarPreviewGroup{padding:2px 4px}
@media(max-height:660px){#scenePreviewDock #summonCanvas{width:min(100%,clamp(110px,19dvh,160px))}#scenePreviewDock{top:56px}}
#cardSettings{min-height:0;overflow:visible;padding-bottom:24px}#cardSettings #editor{background:#101116} 
</style></head><body>
<div id="editTopNav" style="position:relative;z-index:42;padding:8px;background:#101116"><button id="backToArchive" style="padding:10px 14px;background:#302b28;color:#f7e6c7;border:1px solid #826c4c;border-radius:9px">← 人物帖へ戻る</button></div><iframe id="editor" title="召喚カード自由編集室"></iframe>
<div id="backupBar"><button id="backupAll" title="立ち絵・背景・カード・召喚設定をまとめて保存">まとめてバックアップ</button><button id="restoreAll" title="バックアップを復元">まとめて復元</button><input id="restoreAllFile" type="file" accept="application/json,.json" hidden></div>
<details id="summonEdit"><summary>✨ 召喚画面を編集（立ち絵の大きさ・位置）</summary>
<div id="summonCanvas" aria-label="召喚立ち絵の配置プレビュー"><div id="summonRing">✧<span>召 喚</span>✧</div><img id="summonArt" alt="立ち絵のプレビュー"><div id="summonPlaceholder">紹介カードで立ち絵を読み込んでください</div><div id="summonCanvasLabel">ここでドラッグ・2本指でピンチ</div></div>
<div class="summonExtra"><h3>魔法陣の色</h3><label>色の決め方<select id="ritualColorMode"><option value="skill">得意技能カラー（自動）</option><option value="custom">好きな色を指定</option></select></label><p id="skillColorInfo" class="colorInfo"></p><div class="fields"><label>主色<input id="ritualPrimary" type="color" value="#ef4444"></label><label>副色<input id="ritualSecondary" type="color" value="#3b82f6"></label></div><div class="gradientBalanceBox" style="margin:14px 0;padding:12px;border:1px solid #705a41;border-radius:10px;background:#16151c"><h3 style="margin:0 0 10px">グラデーションの配分</h3><label style="display:block;margin-bottom:8px">配分の決め方<select id="gradientBalanceMode" style="display:block;width:100%;margin-top:5px;padding:9px;background:#25212b;color:#f5e8d7;border:1px solid #846d4b;border-radius:7px"><option value="auto">技能の成長率の差から自動</option><option value="manual">自分で調節</option></select></label><div style="display:flex;justify-content:space-between;gap:8px;margin:10px 0 4px"><span>主色 <output id="gradientPrimaryPercent">50%</output></span><span>副色 <output id="gradientSecondaryPercent">50%</output></span></div><input id="gradientBalance" type="range" min="5" max="95" step="1" value="50" style="width:100%"><div id="gradientBalanceBar" style="height:17px;border-radius:8px;margin:10px 0;background:linear-gradient(90deg,#ef4444,#3b82f6)"></div><p id="gradientBalanceInfo" class="colorInfo" style="margin:6px 0 0"></p></div><h3>レアリティ演出</h3><p class="colorInfo">能力値8項目の合計で★1～★5を判定。光の色は魔法陣の主色に連動します。</p><div class="fields"><label>名前の文字色<input id="summonNameColor" type="color" value="#f1e5d3"></label><label>紹介文の文字色<input id="summonLabelColor" type="color" value="#e9ca91"></label></div><div id="rarityInfo" class="colorInfo"></div><button id="testRarity" type="button" class="extraButton">✦ レアリティ演出をお試し</button><div id="raritySample" class="raritySample" hidden></div></div><div class="fields"><label>立ち絵の大きさ <output id="scaleVal">145%</output><input id="summonScale" type="range" min="70" max="250" value="145"></label>
<label>左右の位置 <output id="xVal">0%</output><input id="summonX" type="range" min="-45" max="45" value="0"></label>
<label>上下の位置 <output id="yVal">-7%</output><input id="summonY" type="range" min="-45" max="45" value="-7"></label>
<label>立ち絵の光 <output id="glowVal">24px</output><input id="summonGlow" type="range" min="0" max="65" value="24"></label>
</div><div class="summonActions"><button id="resetSummon">召喚画面を初期値に</button><button id="summonPreview">🔥 この設定で召喚テスト</button></div><small>設定は自動保存。指での移動・ピンチ拡大縮小はこの編集プレビューだけで行います。召喚本番は完成形として固定されます。</small></details>
<div id="experience"><iframe id="ritual" title="旧き印の炎"></iframe><div id="touchSurface" aria-label="立ち絵をドラッグ・ピンチで調整"></div><iframe id="cardview" title="探索者紹介画面"></iframe><button id="exitPlay" style="position:absolute;z-index:12;top:max(14px,env(safe-area-inset-top));left:12px;right:auto;background:#15151bde;border:1px solid #c99c5d;border-radius:999px;color:#fff1d9;padding:9px 13px">✕ 人物帖へ</button><button id="skipIntro">演出をスキップ</button><button id="nextScene" aria-label="タップして紹介画面へ">画面をタップして紹介画面へ　›</button><div id="overlayControls"><button id="replay">↻ もう一度召喚</button><button id="close">✕ 人物帖へ戻る</button></div></div>
<script>
let editorHtml="\u003c!doctype html>\u003chtml lang=\"ja\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>\u4eba\u7269\u5e16 | \u53ec\u559a\u30ab\u30fc\u30c9\u7de8\u96c6\u5ba4\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#101116;color:#f1e8d8;font-family:system-ui,sans-serif}header{padding:12px 14px;border-bottom:1px solid #69583c;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:16px;margin:0}button,input,select,textarea{font:inherit}button{background:#302b28;color:#f7e6c7;border:1px solid #826c4c;border-radius:9px;padding:9px 11px;cursor:pointer}button.primary{background:#8b683d;color:#fff}button:disabled{opacity:.4}main{max-width:850px;margin:auto;padding:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,280px);gap:15px}.previewWrap{display:flex;justify-content:center;align-items:flex-start;overflow:hidden}.stage{width:min(100%,390px);aspect-ratio:9/16;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 35% 38%,#34313b,#11141d 65%,#090a10);border:1px solid #a28a63;box-shadow:0 16px 45px #0008;touch-action:none}.stage:before{content:'';position:absolute;inset:7%;border:1px solid #bba17145;pointer-events:none;z-index:1}.stage:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#e4bb7920,transparent 55%);pointer-events:none;z-index:1}.element{position:absolute;touch-action:none;user-select:none;cursor:grab;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3;min-width:20px;min-height:16px}.element.selected{outline:1px dashed #fff7b4;outline-offset:3px}.element img{width:100%;height:100%;object-fit:contain;pointer-events:none}.element.image{filter:drop-shadow(10px 12px 7px #000b) drop-shadow(-4px -2px 8px #f1c78144)}.element.chart{background:#14131b44}.element.quote{border-left:2px solid currentColor;padding-left:6px;font-style:italic}.element .resize{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;background:#e2b879;border:2px solid #151515;border-radius:3px;display:none;cursor:nwse-resize}.element.selected .resize{display:block}.panel{background:#1b1d25;border:1px solid #4b4338;border-radius:12px;padding:12px;align-self:start}.panel h2{font-size:14px;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#d5b991;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:#101218;border:1px solid #5d5144;color:#f1e8d8;border-radius:6px;padding:8px}.field input[type=color]{height:38px;padding:2px}.field input[type=range]{padding:0}.field small{color:#b9b0a2}.font-controls{display:flex;gap:8px;align-items:center}.font-controls input[type=range]{flex:1;min-width:0}.font-controls input[type=number]{flex:none}.buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.buttons button{font-size:12px}.hint{font-size:12px;color:#bcb4a6;line-height:1.6;margin:9px 0}.hidden{display:none!important}.summon{position:fixed;inset:0;z-index:200;background:#08090c;display:none;place-items:center;overflow:hidden}.summon.on{display:grid}.summon .sigil{width:min(80vw,65vh);aspect-ratio:1;filter:drop-shadow(0 0 12px #ee7b2c);animation:spin 3.3s cubic-bezier(.2,.4,.8,1) forwards}.summon svg{width:100%;height:100%}.summon .burn{position:absolute;width:65vmin;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 20%,#f4b14c77 50%,transparent 75%);opacity:0;animation:burn 3.4s forwards}.summon .flash{position:absolute;inset:0;background:#ffe3b2;opacity:0;animation:flash 3.7s forwards}.summon .close{position:absolute;right:12px;top:12px;z-index:10}.summon .cardfinal{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:final 4.6s forwards;pointer-events:none}.summon .cardfinal .stage{height:100dvh;width:auto;max-width:100vw;border:0;box-shadow:none}.summon .cardfinal .element{outline:0}.summon .cardfinal .resize{display:none}.summon .continue{position:absolute;bottom:20px;z-index:5;opacity:0;animation:final 4.6s forwards}@keyframes spin{0%{transform:rotate(0);opacity:0;scale:.4}25%{opacity:1}70%{transform:rotate(320deg);scale:1}100%{transform:rotate(1150deg);opacity:0;scale:1.3}}@keyframes burn{35%{opacity:0}60%{opacity:1}100%{opacity:0}}@keyframes flash{80%{opacity:0}86%{opacity:.9}100%{opacity:0}}@keyframes final{0%,78%{opacity:0}100%{opacity:1}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.panel{order:2}.stage{width:min(100%,390px)}header{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.summon .sigil{animation-duration:.6s}.summon .cardfinal,.summon .continue{animation-duration:.8s}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>\u2726 \u4eba\u7269\u5e16\uff5c\u53ec\u559a\u30ab\u30fc\u30c9\u7de8\u96c6\u5ba4\u003c/h1>\u003cspan style=\"font-size:11px;color:#c9b08b\">\u72ec\u7acb\u8a66\u4f5c\u7248 / \u30aa\u30d5\u30e9\u30a4\u30f3\u003c/span>\u003c/header>\u003cmain>\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"summonBtn\">\ud83d\udd25 \u53ec\u559a\u30c6\u30b9\u30c8\u003c/button>\u003cbutton id=\"saveBtn\">\u7aef\u672b\u306b\u4fdd\u5b58\u003c/button>\u003cbutton id=\"exportBtn\">\u8a2d\u5b9a\u3092\u66f8\u304d\u51fa\u3057\u003c/button>\u003cbutton id=\"importBtn\">\u8a2d\u5b9a\u3092\u8aad\u307f\u8fbc\u307f\u003c/button>\u003cinput type=\"file\" id=\"importFile\" accept=\"application/json\" hidden>\u003cbutton id=\"resetBtn\">\u521d\u671f\u914d\u7f6e\u306b\u623b\u3059\u003c/button>\u003c/div>\u003cdiv class=\"workspace\">\u003cdiv>\u003cdiv class=\"previewWrap\">\u003cdiv id=\"stage\" class=\"stage\">\u003c/div>\u003c/div>\u003cp class=\"hint\">\u30d1\u30fc\u30c4\u3092\u30bf\u30c3\u30d7\u3057\u3066\u9078\u629e\u3057\u3001\u6307\u3067\u52d5\u304b\u305b\u307e\u3059\u3002\u540d\u524d\u3084\u30bb\u30ea\u30d5\u306e\u6587\u5b57\u30b5\u30a4\u30ba\u306f\u30b9\u30e9\u30a4\u30c0\u30fc\u3068\u6570\u5024\u5165\u529b\u3067\u8abf\u6574\u3067\u304d\u307e\u3059\u3002\u53f3\u4e0b\u306e\u5c0f\u3055\u306a\u56db\u89d2\u3067\u30b5\u30a4\u30ba\u5909\u66f4\u3002\u4e0b\u306e\u7de8\u96c6\u6b04\u304b\u3089\u7d30\u304b\u306a\u8abf\u6574\u3082\u3067\u304d\u307e\u3059\u3002\u003c/p>\u003c/div>\u003caside class=\"panel\">\u003ch2>\u30c7\u30b6\u30a4\u30f3\u7de8\u96c6\u003c/h2>\u003cdiv class=\"field\">\u003clabel>\u80cc\u666f\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u003c/label>\u003cselect id=\"template\">\u003coption value=\"gold\">\u9ed2\u91d1\u30fb\u53e4\u5178\u003c/option>\u003coption value=\"blue\">\u7d3a\u9752\u30fb\u661f\u591c\u003c/option>\u003coption value=\"red\">\u6df1\u7d05\u30fb\u5100\u5f0f\u003c/option>\u003coption value=\"plain\">\u9ed2\u30fb\u30b7\u30f3\u30d7\u30eb\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>\u80cc\u666f\u753b\u50cf\uff08\u30b9\u30de\u30db\u304b\u3089\u8ffd\u52a0\uff09\u003c/label>\u003cinput type=\"file\" id=\"bgFile\" accept=\"image/png,image/jpeg,image/webp\">\u003csmall>PNG\u30fbJPEG\u30fbWebP\u5bfe\u5fdc\u3002\u753b\u50cf\u306f\u8a2d\u5b9a\u30c7\u30fc\u30bf\u306b\u542b\u307e\u308c\u307e\u3059\u3002\u003c/small>\u003c/div>\u003cdiv class=\"field\">\u003clabel>\u80cc\u666f\u753b\u50cf\u306e\u8868\u793a\u65b9\u6cd5\u003c/label>\u003cselect id=\"bgFit\">\u003coption value=\"cover\">\u753b\u9762\u3044\u3063\u3071\u3044\u306b\u8868\u793a\uff08\u306f\u307f\u51fa\u3057\u3042\u308a\uff09\u003c/option>\u003coption value=\"contain\">\u753b\u50cf\u5168\u4f53\u3092\u8868\u793a\uff08\u4f59\u767d\u3042\u308a\uff09\u003c/option>\u003coption value=\"stretch\">\u753b\u9762\u306b\u5408\u308f\u305b\u3066\u4f38\u7e2e\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>\u63a2\u7d22\u8005\u306e\u7acb\u3061\u7d75\uff08\u900f\u904ePNG\u63a8\u5968\uff09\u003c/label>\u003cinput type=\"file\" id=\"portraitFile\" accept=\"image/png,image/jpeg,image/webp\">\u003csmall>\u3053\u3053\u304b\u3089\u7acb\u3061\u7d75\u3092\u8aad\u307f\u8fbc\u3080\u3068\u3001\u5de6\u5074\u306e\u7acb\u3061\u7d75\u30d1\u30fc\u30c4\u306b\u53cd\u6620\u3057\u307e\u3059\u3002\u6307\u3067\u79fb\u52d5\u30fb\u62e1\u5927\u7e2e\u5c0f\u3067\u304d\u307e\u3059\u3002\u003c/small>\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton id=\"clearBg\">\u80cc\u666f\u753b\u50cf\u3092\u89e3\u9664\u003c/button>\u003cbutton id=\"addImage\">\u88c5\u98fe\u753b\u50cf\u3092\u8ffd\u52a0\u003c/button>\u003cbutton id=\"replaceImage\">\u9078\u629e\u753b\u50cf\u3092\u5dee\u3057\u66ff\u3048\u003c/button>\u003cbutton id=\"addText\">\u6587\u5b57\u3092\u8ffd\u52a0\u003c/button>\u003c/div>\u003cinput type=\"file\" id=\"imageFile\" accept=\"image/png,image/jpeg,image/webp\" hidden>\u003cinput type=\"file\" id=\"replaceFile\" accept=\"image/png,image/jpeg,image/webp\" hidden>\u003chr style=\"border-color:#49443e;margin:17px 0\">\u003ch2>\u9078\u629e\u4e2d\u306e\u30d1\u30fc\u30c4\u003c/h2>\u003cdiv id=\"none\" class=\"hint\">\u753b\u9762\u5185\u306e\u30d1\u30fc\u30c4\u3092\u30bf\u30c3\u30d7\u3057\u3066\u304f\u3060\u3055\u3044\u3002\u003c/div>\u003cdiv id=\"editor\" class=\"hidden\">\u003cdiv class=\"field\">\u003clabel>\u7a2e\u985e\u003c/label>\u003cdiv id=\"kind\">\u003c/div>\u003c/div>\u003cdiv class=\"field\" id=\"textField\">\u003clabel>\u8868\u793a\u30c6\u30ad\u30b9\u30c8\u003c/label>\u003ctextarea id=\"content\" rows=\"3\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\">\u003clabel>\u4f4d\u7f6e\u30fb\u5927\u304d\u3055\uff08%\uff09\u003c/label>\u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px\">\u003cinput id=\"x\" type=\"number\" placeholder=\"X\">\u003cinput id=\"y\" type=\"number\" placeholder=\"Y\">\u003cinput id=\"w\" type=\"number\" placeholder=\"\u5e45\">\u003cinput id=\"h\" type=\"number\" placeholder=\"\u9ad8\u3055\">\u003c/div>\u003c/div>\u003cdiv class=\"field\" id=\"fontField\">\u003clabel>\u6587\u5b57\u30b5\u30a4\u30ba\u003c/label>\u003cdiv class=\"font-controls\">\u003cinput id=\"font\" type=\"range\" min=\"8\" max=\"100\" step=\"1\">\u003cinput id=\"fontNumber\" type=\"number\" min=\"8\" max=\"100\" step=\"1\" aria-label=\"\u6587\u5b57\u30b5\u30a4\u30ba\u3092\u6570\u5024\u5165\u529b\" style=\"width:78px\">\u003c/div>\u003csmall id=\"fontVal\">\u003c/small>\u003c/div>\u003cdiv class=\"field\" id=\"colorField\">\u003clabel>\u6587\u5b57\u8272\u003c/label>\u003cinput id=\"color\" type=\"color\">\u003c/div>\u003cdiv id=\"chartColorFields\" class=\"hidden\">\n\u003cdiv class=\"field\">\u003clabel>\u30c1\u30e3\u30fc\u30c8\u306e\u7dda\u306e\u8272\u003c/label>\u003cinput id=\"chartStroke\" type=\"color\" value=\"#ebc58b\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>\u30c1\u30e3\u30fc\u30c8\u306e\u5857\u308a\u8272\u003c/label>\u003cinput id=\"chartFill\" type=\"color\" value=\"#d9ae62\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>\u30c1\u30e3\u30fc\u30c8\u306e\u80cc\u666f\u30b0\u30ea\u30c3\u30c9\u8272\u003c/label>\u003cinput id=\"chartGrid\" type=\"color\" value=\"#bba171\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>\u80fd\u529b\u5024\u30e9\u30d9\u30eb\u306e\u8272\u003c/label>\u003cinput id=\"chartLabel\" type=\"color\" value=\"#eed4a9\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel>\u30c1\u30e3\u30fc\u30c8\u5857\u308a\u306e\u6fc3\u3055 \u003cspan id=\"chartFillAlphaVal\">27%\u003c/span>\u003c/label>\u003cinput id=\"chartFillAlpha\" type=\"range\" min=\"0\" max=\"100\" value=\"27\">\u003c/div>\n\u003c/div>\u003cdiv class=\"field\">\u003clabel>\u4e0d\u900f\u660e\u5ea6\u003c/label>\u003cinput id=\"opacity\" type=\"range\" min=\"0\" max=\"100\">\u003csmall id=\"opacityVal\">\u003c/small>\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton id=\"front\">\u6700\u524d\u9762\u3078\u003c/button>\u003cbutton id=\"back\">\u6700\u80cc\u9762\u3078\u003c/button>\u003cbutton id=\"delete\">\u524a\u9664\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"hint\">\u203b \u4eba\u7269\u5e16\u3068\u306e\u81ea\u52d5\u9023\u52d5\u306f\u672a\u5b9f\u88c5\u3002\u73fe\u5728\u306f\u30b5\u30f3\u30d7\u30eb\u30c7\u30fc\u30bf\u3067\u30ec\u30a4\u30a2\u30a6\u30c8\u3092\u4f5c\u308b\u305f\u3081\u306e\u8a66\u4f5c\u3067\u3059\u3002\u003c/p>\u003c/aside>\u003c/div>\u003c/main>\u003cdiv id=\"summon\" class=\"summon\">\u003cbutton class=\"close\" id=\"skip\">\u30b9\u30ad\u30c3\u30d7 / \u9589\u3058\u308b\u003c/button>\u003cdiv class=\"sigil\">\u003csvg viewBox=\"0 0 300 300\">\u003cg stroke=\"#ffb668\" fill=\"none\" stroke-width=\"1.6\">\u003ccircle cx=\"150\" cy=\"150\" r=\"138\"/>\u003ccircle cx=\"150\" cy=\"150\" r=\"119\" stroke-dasharray=\"5 5\"/>\u003ccircle cx=\"150\" cy=\"150\" r=\"93\"/>\u003cpolygon points=\"150,33 178,115 265,115 194,167 220,250 150,199 80,250 106,167 35,115 122,115\"/>\u003cpath d=\"M95 150 Q150 90 205 150 Q150 210 95 150Z\"/>\u003ccircle cx=\"150\" cy=\"150\" r=\"15\"/>\u003cpath d=\"M150 126 V174 M126 150 H174\"/>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv class=\"burn\">\u003c/div>\u003cdiv class=\"flash\">\u003c/div>\u003cdiv class=\"cardfinal\" id=\"final\">\u003c/div>\u003cbutton class=\"continue\" id=\"again\">\u3082\u3046\u4e00\u5ea6\u53ec\u559a\u003c/button>\u003c/div>\u003cscript>\nconst $=s=>document.querySelector(s);const stage=$('#stage');const key='jinbutsucho_card_editor_trial_v1';let selected=null;let counter=0;let state={template:'gold',background:'',bgFit:'cover',items:[]};const presets={gold:'radial-gradient(ellipse at 36% 40%,#3b3440,#11141d 67%,#08090d)',blue:'radial-gradient(ellipse at 35% 42%,#203d58,#101827 68%,#070b14)',red:'radial-gradient(ellipse at 35% 42%,#4b2025,#1a1018 68%,#0b080d)',plain:'#101117'};const defaults=()=>[{id:'figure',kind:'image',name:'\u7acb\u3061\u7d75',x:-9,y:3,w:66,h:94,z:5,src:'',opacity:100},{id:'name',kind:'text',name:'\u540d\u524d',x:48,y:14,w:49,h:10,z:6,text:'\u63a2\u7d22\u8005\u306e\u540d\u524d',font:26,color:'#f5e8cf',opacity:100},{id:'profile',kind:'text',name:'\u30d7\u30ed\u30d5\u30a3\u30fc\u30eb',x:50,y:29,w:46,h:18 // Large embedded PNGs are kept once as blob URLs instead of copied into
// every ritual/card iframe's srcdoc string (Android WebView memory pressure).
const previewBlobs=new Map();
function previewImageUrl(data){
 if(typeof data!=='string'||!data.startsWith('data:image/')||!data.includes(';base64,'))return data;
 if(previewBlobs.has(data))return previewBlobs.get(data);
 try{
  const comma=data.indexOf(','), mime=data.slice(5,data.indexOf(';'));
  const binary=atob(data.slice(comma+1));
  const chunks=[];
  for(let i=0;i<binary.length;i+=32768){
   const part=binary.slice(i,i+32768), bytes=new Uint8Array(part.length);
   for(let j=0;j<part.length;j++)bytes[j]=part.charCodeAt(j);
   chunks.push(bytes);
  }
  const url=URL.createObjectURL(new Blob(chunks,{type:mime}));
  previewBlobs.set(data,url);
  return url;
 }catch(err){console.warn('Preview image conversion failed',err);return data}
}
function releasePreviewBlobs(){
 for(const url of previewBlobs.values())URL.revokeObjectURL(url);
 previewBlobs.clear();
}
window.addEventListener('pagehide',releasePreviewBlobs);

 const skills=linked.skills||{};
 let overrides={};
 try{overrides=JSON.parse(localStorage.getItem('jinbutsucho_stable_v1_category_overrides')||'{}')||{}}catch(e){}
 const groups={
 '戦闘技能':['回避','キック','組み付き','こぶし','頭突き','投擲','マーシャルアーツ','拳銃','ライフル','ショットガン','マシンガン','サブマシンガン','武道'],

 };
 const byCat={};
 for(const [name,raw] of Object.entries(skills)){
  const value=Number(typeof raw==='object'?(raw.value??raw.total??0):raw);
  const base=Number(typeof raw==='object'?(raw.base??NaN):NaN);

}

  localStorage.setItem(cardKey,JSON.stringify(data.card));
