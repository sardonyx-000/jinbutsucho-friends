function statTotal(c){const vals=['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>c.stats?.[k]);return vals.some(v=>v==null||String(v).trim()===''||!Number.isFinite(Number(v)))?null:vals.reduce((a,v)=>a+Number(v),0)}

const CharacterStore=(()=>{
 const key='jinbutsucho_stable_v1_characters';
 let dbPromise;
 function db(){return dbPromise ||= new Promise((resolve,reject)=>{const r=indexedDB.open('jinbutsucho-character-storage',1);r.onupgradeneeded=()=>r.result.createObjectStore('archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('保存領域が使用中です'));});}
 async function read(){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('archive','readonly'),r=t.objectStore('archive').get(key);t.oncomplete=()=>resolve(r.result);t.onabort=t.onerror=()=>reject(t.error||r.error);});}
 async function write(value){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('archive','readwrite');t.objectStore('archive').put(value,key);t.oncomplete=()=>resolve();t.onabort=t.onerror=()=>reject(t.error);});}
 async function load(){let value=await read();if(value===undefined){const raw=localStorage.getItem(key);value=raw===null?[]:JSON.parse(raw);if(!Array.isArray(value))throw Error('旧データの形式が不正です');await write(value);}if(!Array.isArray(value))throw Error('保存データの形式が不正です');try{localStorage.removeItem(key)}catch(_){}return value;}
 return {load,write};
})();

 try{
  for(const f of files){
   if(!f.type.startsWith('image/'))throw Error('画像以外のファイルが含まれています');
   const data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('ファイルを読み込めません'));r.readAsDataURL(f);
   });
   const converted=await new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>{
     const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
     const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
     canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
     resolve(canvas.toDataURL('image/webp',.82));
    };img.onerror=()=>reject(Error('画像を開けません'));img.src=data;
   });
   pendingGallery.push(converted);
  }
  drawGalleryEditor();
  if(status)status.textContent=`${files.length}枚を追加しました。保存容量に注意してください。`;
 }catch(err){if(status)status.textContent='読み込みエラー: '+err.message}

const MADNESS_CATEGORIES={
 '戦闘技能':['回避','キック','組み付き','こぶし','頭突き','投擲','マーシャルアーツ','拳銃','サブマシンガン','ショットガン','マシンガン','ライフル','杖','日本刀','刀','剣','ナイフ','槍','斧','弓','武道'],
 '探索技能':['応急手当','鍵開け','隠す','隠れる','聞き耳','忍び歩き','写真術','精神分析','追跡','登攀','図書館','目星'],

 '交渉技能':['言いくるめ','信用','説得','値切り','母国語','ほかの言語','他の言語','外国語'],
 '知識技能':['医学','オカルト','化学','クトゥルフ神話','芸術','経理','考古学','コンピューター','心理学','人類学','生物学','地質学','電子工学','天文学','博物学','物理学','法律','薬学','歴史']

function madnessCategory(name,skill){
 const custom=categoryOverrides[name]||skill?.category;
 if(custom){const c=String(custom);if(MADNESS_CATEGORIES[c])return c;if(MADNESS_CATEGORIES[c+'技能'])return c+'技能';}
 const n=skillIdentity(name).replace(/\(.*?\)/g,'');
 for(const [cat,names] of Object.entries(MADNESS_CATEGORIES)){if(names.some(x=>n===x||n.startsWith(x+'：')||n.startsWith(x+':')))return cat}
 return 'その他';
}
function madnessEntries(c){return Array.isArray(c.madness)?c.madness.filter(x=>x&&MADNESS_TYPES[x.type]):[]}
function madnessActive(c){return madnessEntries(c).filter(x=>x.status!=='cured'&&x.apply===true)}
function madnessModifiers(c){
 const result={stats:{},rolls:{},skills:{}},active=madnessActive(c);
 const stat=(k,n)=>result.stats[k]=(result.stats[k]||0)+n;
 const roll=(k,n)=>result.rolls[k]=(result.rolls[k]||0)+n;
 const skill=(k,n)=>result.skills[k]=(result.skills[k]||0)+n;
 const group=(cat,n,excluded=[])=>{for(const [k,v] of Object.entries(c.skills||{}))if(madnessCategory(k,v)===cat&&!excluded.includes(k))skill(k,n)};
 const all=(n)=>{for(const k of Object.keys(c.skills||{}))skill(k,n)};
 for(const m of active){
  const v=m.variant||'';
  switch(m.type){
   case 'dependence':for(const k of ['言いくるめ','説得','信用','値切り'])skill(k,-20);skill('目星',v==='対象がない'?-15:-10);break;
   case 'exhaustion':if(v==='人がいる場所')all(-20);if(v==='精神分析を受けた相手と二人きり')all(-10);break;
   case 'phobia':if(v==='恐怖対象がある'){all(-10);group('戦闘技能',-10);group('行動技能',-10)}break; // 身体を動かす技能の暫定判定
   case 'obsession':stat('INT',-2);if(m.conditionActive)group('交渉技能',-20);break;
   case 'eating':group('探索技能',-10);roll('アイデア',-20);stat(v==='拒食'?'STR':v==='悪食'?'CON':'POW',-1);break;
   case 'sleeping':stat(v==='過眠'?'POW':'CON',-1);group(v==='過眠'?'戦闘技能':'探索技能',-10);roll('アイデア',-20);break;
   case 'illness':stat('POW',-1);stat('EDU',-1);group('知識技能',-20);break;
   case 'amnesia':roll('アイデア',-30);roll('知識',-30);break;
   case 'selfharm':group(v==='首元'?'交渉技能':v==='手・足'?'行動技能':'探索技能',-20);break;
  }
 }
 return result;
}
function madnessStatDisplay(c,key){const n=c.stats?.[key],mod=madnessModifiers(c).stats[key]||0;if(n===''||n==null||!Number.isFinite(Number(n)))return '—';return `${Number(n)+mod}${mod?` <small class="madness-delta">(${mod})</small>`:''}`}
function madnessRollDisplay(c,label,key){const n=c.stats?.[key];if(n===''||n==null||!Number.isFinite(Number(n)))return '—';const mods=madnessModifiers(c);const statmod=mods.stats[key]||0,rollmod=mods.rolls[label]||0;const val=(Number(n)+statmod)*5+rollmod;return `${val}${statmod||rollmod?` <small class="madness-delta">(${statmod*5+rollmod})</small>`:''}`}
function madnessSkillDisplay(c,name,v){const raw=v?.value;if(raw===''||raw===null||raw===undefined)return '—';const n=Number(raw);if(!Number.isFinite(n))return esc(raw);const d=madnessModifiers(c).skills[name]||0;return `${n+d}${d?` <small class="madness-delta">(${d})</small>`:''}`}

function splitRecordMemo(text){
 const out={story:[],af:[],madness:[],after:[],combined:[],spell:[]};let kind='story';
 const targets={'呪文':'spell','魔術':'spell','魔導書':'spell','af':'af','アーティファクト':'af','af・アーティファクト':'af','不定':'madness','不定の狂気':'madness','後遺症':'after','不定・後遺症':'combined','不定の狂気・後遺症':'combined','後遺症・不定':'combined','後遺症・不定の狂気':'combined'};
 for(const raw of String(text||'').split(/\r?\n/)){
  const t=raw.normalize('NFKC').trim();
  const line=t.replace(/^[\s■□◆◇●▪▫#*_【\[<〈]+/,'').replace(/[\s*_】\]>〉:]+$/,'').trim();
  if(/^[\[【<〈■\s]*(?:門の創造)(?:\s*\(CREATE GATE\))?[\]】>〉\s]*$/i.test(t)){kind='spell';out[kind].push(raw);continue;}
  const item=t.match(/^[\s\[【<〈■*_]*(AF|アーティファクト|呪文|魔導書|魔術)[\s】\]>〉:：]*(.*)$/i);
  if(item && item[2].trim() && !/^(?:・アーティファクト|の狂気)$/.test(item[2]) && (/^[\[【<〈■]/.test(t)||/^(?:AF|呪文)[：:]/i.test(t))){kind=/^(AF|アーティファクト)$/i.test(item[1])?'af':'spell';out[kind].push(raw);continue;}
  const m=line.match(/^([^:]+?)(?:\s*:\s*(.*))?$/);const key=m?m[1].replace(/\s/g,'').replace(/[\/／、&＆]/g,'・').toLowerCase():'';
  if(Object.prototype.hasOwnProperty.call(targets,key)){kind=targets[key];if(m[2])out[kind].push(raw);continue;}
  const boundary=/^(?:持ち物|所持品|携行品|装備(?:品)?|経歴(?:・メモ)?|人物設定|プロフィール|特徴(?:表)?|職業(?:技能|特記)?|通過シナリオ|シナリオ記録|呪文|魔術|追加メモ|メモ|ネタバレ|秘匿(?:メモ)?)(?:\s*[:：].*)?$/.test(line);
  if(boundary||/^[■□◆◇●▪▫#]+/.test(t)||/^__?[■□]/.test(t))kind='story';
  out[kind].push(raw);
 }
 return Object.fromEntries(Object.entries(out).map(([k,v])=>[k,v.join('\n').trim()]));
}
const RECORD_FIELDS={story:'経歴・メモ',af:'AF・アーティファクト',spell:'呪文・魔導書',madness:'不定の狂気（メモ）',after:'後遺症',combined:'不定・後遺症（共通記載）'};

function recordParts(c){const a=splitRecordMemo(c.story),b=splitRecordMemo(c.sheetKnowledge);for(const k of Object.keys(RECORD_FIELDS)){if(b[k]&&!a[k].includes(b[k]))a[k]=[a[k],b[k]].filter(Boolean).join('\n\n');if(c.recordOverrides&&Object.prototype.hasOwnProperty.call(c.recordOverrides,k))a[k]=c.recordOverrides[k]}return a}

if(tab==='skills')body=`<label class="initial-skill-toggle" style="display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:10px;cursor:pointer"><input type="checkbox" ${showInitialSkills?'checked':''} onchange="showInitialSkills=this.checked;detailPage()" style="width:20px;height:20px;accent-color:var(--accent)"><span>初期値の技能も表示</span></label>`+renderGroupedCharacterSkills(c.skills||{},showInitialSkills,c);
if(tab==='record')body=`<h2>通過シナリオ</h2>${(c.scenarios||[]).length?`<ul>${c.scenarios.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">記録なし</p>'}${recordMemoHtml(c)}<details><summary>ネタバレ・秘匿メモを表示</summary><p style="white-space:pre-wrap">${esc(c.spoiler||'未登録')}</p><p class="notice">これは表示を隠すだけの機能です。パスワードによる暗号化ではありません。</p></details>`;
document.getElementById('detailContent').innerHTML=body;memoryCharacterSection(c.id)}

// 個別ページの技能はキャラシの区分に従ってグループ表示する。
// 未分類や独自技能も削除せず「その他」に表示する。
function renderGroupedCharacterSkills(skills,includeInitial=false,character=null){
 const allEntries=Object.entries(skills||{});
 if(!allEntries.length)return '<p class="muted">技能未登録</p>';
 // 初期値が記録されている場合だけ比較する。初期値不明の独自技能は隠さない。
 const entries=includeInitial?allEntries:allEntries.filter(([name,v])=>{
  const value=Number(v&&v.value),base=Number(v&&v.base);
  return v==null||v.base==null||v.base===''||!Number.isFinite(value)||!Number.isFinite(base)||value!==base;
 });
 if(!entries.length)return '<p class="muted">初期値を超える技能はありません。「初期値の技能も表示」にチェックを入れるとすべて確認できます。</p>';
 const standard=SKILL_CATS.slice(0,-1);
 const groups=new Map();
 entries.forEach(([name,v])=>{
  const resolved=categoryOverrides[name]||baseSkillCategory(name,v);
  if(!groups.has(resolved))groups.set(resolved,[]);
  groups.get(resolved).push([name,v||{}]);
 });
 const cats=[...groups.keys()].sort((a,b)=>{
  const ia=standard.indexOf(a),ib=standard.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'ja');
 });
 return cats.map(cat=>`<section class="skill-category"><h3 class="skill-category-title">${esc(cat)} <span class="small">${groups.get(cat).length}件</span></h3>${groups.get(cat).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,v])=>`<div class="skillrow"><div class="line"><span>${esc(name)}</span><b>${character?madnessSkillDisplay(character,name,v):esc(v.value??'—')}%</b></div><div class="bar"><div style="width:${Math.max(0,Math.min(100,+v.value||0))}%"></div></div></div>`).join('')}</section>`).join('');
}
function allSkillNames(){return [...new Set(chars.flatMap(c=>Object.keys(c.skills||{})))].sort((a,b)=>a.localeCompare(b,'ja'))}
function searchableSkillNames(){const names=allSkillNames();const extras=names.flatMap(n=>COVER_CHOICES[COVER_SKILLS[skillIdentity(n)]]||[]);return [...new Set([...extras,...names])];}
function allJobTags(){return [...new Set(['公開HO','秘匿HO',...chars.flatMap(c=>getTags(c))])].sort((a,b)=>a.localeCompare(b,'ja'))}
function getTags(c){return Array.isArray(c.jobTags)?c.jobTags:(typeof c.jobTags==='string'?c.jobTags.split(/[,、\n]/).map(x=>x.trim()).filter(Boolean):[])}
function conditionLabel(k){return k?.type==='category'?displayCategory(k.category||'戦闘技能'):k?.skill||'技能を選択'}
function conditionCategoryOptions(){return SKILL_CATS.flatMap(cat=>[cat,...categoryOptions(cat).map(sub=>cat+'：'+sub)])}
function conditionTargetField(c,i){return `<label class="field"><span>検索対象</span><select onchange="conditions[${i}].type=this.value;searchPage()"><option value="skill" ${c.type!=='category'?'selected':''}>技能を指定</option><option value="category" ${c.type==='category'?'selected':''}>区分を指定</option></select></label>${c.type==='category'?`<label class="field"><span>技能区分</span><select onchange="setCondition(${i},'category',this.value)">${conditionCategoryOptions().map(cat=>`<option value="${esc(cat)}" ${(c.category||'戦闘技能')===cat?'selected':''}>${esc(displayCategory(cat))}${categorySubs(cat).length?'全般':''}</option>`).join('')}</select></label><p class="small">区分内で条件を満たす技能が1つ以上ある探索者を検索します。</p>`:`<label class="field"><span>技能</span><button type="button" class="btn" style="width:100%;text-align:left;display:flex;justify-content:space-between" onclick="openSkillPicker(${i})"><span>${esc(c.skill||'技能を選択')}</span><span>⌕ ▾</span></button></label>`}`}
function uniqueSkillHits(hits){const seen=new Set();return hits.filter(v=>{const key=skillIdentity(v.name);if(seen.has(key))return false;seen.add(key);return true})}
function conditionSkills(c,k,qualified=true){if(!k)return [];return uniqueSkillHits(Object.entries(c.skills||{}).filter(([n,v])=>{if(k.type==='category'){const [cat,sub]=(k.category||'戦闘技能').split('：');if((categoryOverrides[n]||baseSkillCategory(n,v))!==cat)return false;if(sub&&!subMatches(skillSub(cat,n),sub))return false;}else if(!coversSkill(n,k.skill))return false;const val=Number(v?.value);if(v?.value==null||v.value===''||!Number.isFinite(val))return false;return !qualified||(val>=k.min&&(!k.aboveBase||(v.base!=null&&v.base!==''&&Number.isFinite(Number(v.base))&&val>Number(v.base))));}).map(([name,v])=>({name,value:Number(v.value)})).sort((a,b)=>b.value-a.value))}
function conditionScore(c,k){return conditionSkills(c,k,false)[0]?.value??-Infinity}
function conditionResultLabel(c,k){if(k.type!=='category'){const hit=conditionSkills(c,k)[0]||conditionSkills(c,k,false)[0];return `${esc(hit?.name||k.skill)}${hit&&skillIdentity(hit.name)!==skillIdentity(k.skill)?'（'+esc(k.skill)+'に適用）':''} ${esc(hit?.value??'—')}%${k.aboveBase?'（初期値超過）':''}`;}const hits=conditionSkills(c,k);return `${esc(conditionLabel(k))}：${hits.length?hits.map(v=>esc(v.name)+' '+v.value+'%').join('、'):'該当なし'}`}
function setCondition(i,key,val){conditions[i][key]=key==='min'?Math.max(0,Math.min(100,Number(val)||0)):key==='aboveBase'?Boolean(val):val;if(key==='min'){const out=document.getElementById('minLabel'+i);if(out)out.textContent=conditions[i].min+'%';const n=document.getElementById('minNumber'+i);if(n&&Number(n.value)!==conditions[i].min)n.value=conditions[i].min;const slider=document.getElementById('minSlider'+i);if(slider&&Number(slider.value)!==conditions[i].min)slider.value=conditions[i].min;}drawResults()}
function addCondition(){conditions.push({skill:orderedSkillNames()[0]||'目星',min:50,aboveBase:false});searchPage()}
function removeCondition(i){if(conditions.length===1)return;conditions.splice(i,1);searchPage()}
const searchFoldState={skills:true,jobs:true,sort:true};
let useSkillConditions=true;
function categorySortScore(c,cat){const vals=uniqueSkillHits(Object.entries(c.skills||{}).filter(([n,v])=>(categoryOverrides[n]||baseSkillCategory(n,v))===cat.split('：')[0]&&(!sortSubs(cat)||sortSubs(cat).some(sub=>subMatches(skillSub(cat,n),sub)))&&v?.value!=null&&v.value!==''&&Number.isFinite(Number(v.value))).map(([n,v])=>({name:n,value:Number(v.value)})).sort((a,b)=>b.value-a.value||a.name.localeCompare(b.name,'ja'))).slice(0,3);return {score:vals.length?vals.reduce((sum,v)=>sum+v.value,0)/vals.length:-Infinity,vals};}
function activeSortCategory(){return advancedSort.startsWith('category:')?advancedSort.slice(9):'';}
function sortSubs(cat){return ({'戦闘技能':combatSortSubs,'交渉技能':socialSortSubs,'行動技能':actionSortSubs,'知識技能':knowledgeSortSubs})[cat]||null}
function sortCategoryLabel(cat){const subs=sortSubs(cat);return !subs?cat:cat+'（'+(subs.map(socialLabel).join('・')||'対象なし')+'）'}
function toggleSortSub(kind,sub,on){const arr=({combat:combatSortSubs,social:socialSortSubs,action:actionSortSubs,knowledge:knowledgeSortSubs})[kind];const next=on?[...new Set([...arr.filter(x=>!(x!==sub&&(subMatches(x,sub)||subMatches(sub,x)))),sub])]:arr.filter(x=>x!==sub);if(kind==='combat')combatSortSubs=next;else if(kind==='social')socialSortSubs=next;else if(kind==='action')actionSortSubs=next;else knowledgeSortSubs=next;searchPage()}
function sortSubField(kind,cat,all,chosen){return `<div id="${kind}SortField" ${advancedSort==='category:'+cat?'':'hidden'}><p class="small">集計対象に含める小区分</p>${all.map(x=>`<label class="base-check"><input type="checkbox" ${chosen.includes(x)?'checked':''} onchange="toggleSortSub('${kind}','${x}',this.checked)">${kind==='social'?socialLabel(x):x}</label>`).join('')}</div>`}
function categoryRankLabel(c,cat){const r=categorySortScore(c,cat);return `<div class="small"><b>${esc(sortCategoryLabel(cat))}：${r.vals.length?Math.round(r.score*10)/10+'%（上位'+r.vals.length+'技能平均）':'未登録'}</b></div><div class="small">${r.vals.map(v=>esc(v.name)+' '+esc(v.value)+'%').join(' / ')}</div>`;}

function updateSearchFoldSummary(){const a=document.getElementById('searchSkillSummary'),b=document.getElementById('searchJobSummary');if(a)a.textContent=!useSkillConditions?'絞り込みOFF':conditions.map(c=>`${conditionLabel(c)} ${c.min}%以上${c.aboveBase?'・初期値超過':''}`).join(conditionMode==='and'?' / ':' または ');if(b)b.textContent=[jobFilter||'全職業',tagFilter||'全タグ'].join(' / ');const sort=document.getElementById('searchSortSummary'),select=document.getElementById('advancedSortSelect');if(sort&&select)sort.textContent=activeSortCategory()?sortCategoryLabel(activeSortCategory())+'が高い順':select.selectedOptions[0]?.textContent||'';const f=document.getElementById('featureSummary');if(f)f.textContent=featureSelected.length?featureSelected.length+'件選択中':'指定なし';const sub=document.getElementById('combatSortField');if(sub)sub.hidden=advancedSort!=='category:戦闘技能';const social=document.getElementById('socialSortField');if(social)social.hidden=advancedSort!=='category:交渉技能';for(const [kind,cat] of [['action','行動技能'],['knowledge','知識技能']]){const el=document.getElementById(kind+'SortField');if(el)el.hidden=advancedSort!=='category:'+cat;}}
function searchPage(){let names=orderedSkillNames();conditions.forEach(c=>{if(!names.includes(c.skill))c.skill=names.find(n=>skillIdentity(n)===skillIdentity(c.skill))||names[0]||''});let jobs=[...new Set(chars.map(c=>c.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));let tags=allJobTags();app.innerHTML=`<div class="small">ADVANCED INVESTIGATOR SEARCH</div><h1>探索者・詳細検索</h1><details class="panel search-fold" ${searchFoldState.skills?'open':''} ontoggle="searchFoldState.skills=this.open"><summary><span>技能条件</span><small id="searchSkillSummary"></small></summary><div class="search-fold-body"><p class="small">「＋条件を追加」でいくつでも増やせます。</p><div id="conditions">${conditions.map((c,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="small">条件 ${i+1}</div>${conditionTargetField(c,i)}<div class="threshold"><div class="threshold-head"><label for="minSlider${i}">最低技能値</label><strong id="minLabel${i}">${c.min}%</strong></div><input id="minSlider${i}" aria-label="最低技能値スライダー" type="range" min="0" max="100" step="1" value="${c.min}" oninput="setCondition(${i},'min',this.value)"><div class="threshold-foot"><span>0%</span><label>数値入力 <input id="minNumber${i}" aria-label="最低技能値を数値入力" type="number" min="0" max="100" value="${c.min}" oninput="setCondition(${i},'min',this.value)"></label><span>100%</span></div><label class="base-check"><input type="checkbox" ${c.aboveBase?'checked':''} onchange="setCondition(${i},'aboveBase',this.checked)"><span>初期値より高い探索者のみ</span></label><div class="small">チェック時は、設定した最低値に加えて、その技能の初期値（キャラシの base）を超える探索者を検索します。</div></div>${conditions.length>1?`<button class="btn danger" onclick="removeCondition(${i})">この条件を削除</button>`:''}</div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="addCondition()">＋ 条件を追加</button><label class="field"><span>条件の組み合わせ</span><select onchange="conditionMode=this.value;drawResults()"><option value="and" ${conditionMode==='and'?'selected':''}>AND：すべて満たす</option><option value="or" ${conditionMode==='or'?'selected':''}>OR：どれかを満たす</option></select></label></div></details><details class="panel search-fold" ${searchFoldState.jobs?'open':''} ontoggle="searchFoldState.jobs=this.open"><summary><span>職業・タグ</span><small id="searchJobSummary"></small></summary><div class="search-fold-body"><label class="field"><span>職業で絞り込む</span><select onchange="jobFilter=this.value;drawResults()"><option value="">すべての職業</option>${jobs.map(j=>`<option value="${esc(j)}" ${jobFilter===j?'selected':''}>${esc(j)}</option>`).join('')}</select></label><label class="field"><span>職業タグで絞り込む</span><select onchange="tagFilter=this.value;drawResults()"><option value="">すべてのタグ</option>${tags.map(t=>`<option value="${esc(t)}" ${tagFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><p class="small">タグは探索者の編集画面で自由に追加できます（例：警察関係、医療関係、公務員）。</p></div></details>${featureSearchPanel()}<details class="panel search-fold" ${searchFoldState.sort?'open':''} ontoggle="searchFoldState.sort=this.open"><summary><span>並び順</span><small id="searchSortSummary"></small></summary><div class="search-fold-body"><label class="field"><span>並び順</span><select id="advancedSortSelect" onchange="advancedSort=this.value;drawResults()"><option value="skill-desc" ${advancedSort==='skill-desc'?'selected':''}>条件1の技能・区分が高い順</option><option value="skill-asc" ${advancedSort==='skill-asc'?'selected':''}>条件1の技能・区分が低い順</option><option value="job" ${advancedSort==='job'?'selected':''}>職業順</option><option value="name" ${advancedSort==='name'?'selected':''}>名前順</option>${SKILL_CATS.map(cat=>`<option value="category:${esc(cat)}" ${advancedSort==='category:'+cat?'selected':''}>${esc(cat)}が高い順</option>`).join('')}</select></label>${sortSubField('combat','戦闘技能',COMBAT_SUBS,combatSortSubs)}${sortSubField('social','交渉技能',SOCIAL_SUBS,socialSortSubs)}${sortSubField('action','行動技能',categoryOptions('行動技能'),actionSortSubs)}${sortSubField('knowledge','知識技能',categoryOptions('知識技能'),knowledgeSortSubs)}<p class="small">区分順は、その区分の上位3技能の現在値の平均で比較します（3件未満は登録分）。技能区分のカスタマイズも反映します。</p><label class="base-check"><input type="checkbox" ${useSkillConditions?'checked':''} onchange="useSkillConditions=this.checked;drawResults()"><span>技能条件で絞り込む（OFFで区分ランキングのみも可能）</span></label></div></details><label class="lost-toggle"><input type="checkbox" ${hideLost?'checked':''} onchange="setHideLost(this.checked)">ロストした探索者を検索結果から除外</label><div id="results"></div><div id="skillPickerHost"></div>`;featureRows();drawResults()}

function openSkillPicker(i){skillPickerIndex=i;skillPickerQuery='';renderSkillPicker()}
function closeSkillPicker(){skillPickerIndex=null;const el=document.getElementById('skillPickerHost');if(el)el.innerHTML=''}
function toggleSkillFavorite(name){const a=skillPrefs.favorites;skillPrefs.favorites=a.includes(name)?a.filter(x=>x!==name):[...a,name];saveSkillPrefs();renderSkillPicker()}
function moveSkill(name,direction){const names=orderedSkillNames();const group=names.filter(n=>skillPrefs.favorites.includes(n)===skillPrefs.favorites.includes(name));let i=group.indexOf(name),j=i+direction;if(j<0||j>=group.length)return;[group[i],group[j]]=[group[j],group[i]];const other=names.filter(n=>skillPrefs.favorites.includes(n)!==skillPrefs.favorites.includes(name));skillPrefs.order=skillPrefs.favorites.includes(name)?[...group,...other]:[...other,...group];saveSkillPrefs();renderSkillPicker()}
function selectPickerSkill(name){if(skillPickerIndex===null)return;conditions[skillPickerIndex].skill=name;closeSkillPicker();searchPage()}
function setSkillPickerQuery(value){skillPickerQuery=value;updateSkillPickerList()}
function updateSkillPickerList(){const list=document.getElementById("skillPickerList");if(!list)return;const filtered=orderedSkillNames().filter(n=>skillQueryMatches(n,skillPickerQuery));list.innerHTML=skillPickerRows(filtered)}
function skillPickerRows(filtered){return filtered.map(n=>`<div class="skill-pick-row"><button class="btn ${skillPrefs.favorites.includes(n)?'primary':''}" style="padding:8px" onclick="toggleSkillFavorite(decodeURIComponent('${encodeURIComponent(n)}'))" aria-label="お気に入り切替">${skillPrefs.favorites.includes(n)?'★':'☆'}</button><button class="skill-pick-name" onclick="selectPickerSkill(decodeURIComponent('${encodeURIComponent(n)}'))">${esc(n)}</button><button class="btn" style="padding:8px" onclick="moveSkill(decodeURIComponent('${encodeURIComponent(n)}'),-1)" aria-label="上へ">↑</button><button class="btn" style="padding:8px" onclick="moveSkill(decodeURIComponent('${encodeURIComponent(n)}'),1)" aria-label="下へ">↓</button></div>`).join('')||'<p class="small">該当する技能がありません</p>'}
function renderSkillPicker(keepFocus=false){const host=document.getElementById('skillPickerHost');if(!host||skillPickerIndex===null)return;const all=orderedSkillNames();const filtered=all.filter(n=>skillQueryMatches(n,skillPickerQuery));host.innerHTML=`<div class="skill-overlay" onclick="if(event.target===this)closeSkillPicker()"><div class="skill-dialog" role="dialog" aria-modal="true" aria-label="技能を選ぶ"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">技能を選ぶ</h2><button class="btn" onclick="closeSkillPicker()">閉じる ×</button></div><p class="small">★ お気に入りは先頭へ。↑↓で表示順を変更できます。</p><input id="skillPickerSearch" class="skill-query" placeholder="技能名を入力して検索（例：心理）" value="${esc(skillPickerQuery)}" oninput="setSkillPickerQuery(this.value)"><div id="skillPickerList" class="skill-picker-list">${skillPickerRows(filtered)}</div><p class="small">表示順はこのブラウザに保存されます。検索結果や技能値は変更されません。</p></div></div>`;if(keepFocus){const input=document.getElementById('skillPickerSearch');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)}}

function matchingSearchCharacters(){return chars.filter(c=>{if(hideLost&&isLost(c))return false;if(jobFilter&&c.job!==jobFilter)return false;if(tagFilter&&!getTags(c).includes(tagFilter))return false;if(featureSelected.length){const f=characterFeatures(c);if(!(featureMode==='and'?featureSelected.every(x=>f.includes(x)):featureSelected.some(x=>f.includes(x))))return false}if(!useSkillConditions)return true;let checks=conditions.map(k=>conditionSkills(c,k).length>0);return conditionMode==='and'?checks.every(Boolean):checks.some(Boolean)});}
function randomSummonFromSearch(replay=false){
 if(!replay)searchSummonPool=matchingSearchCharacters().map(c=>c.id);
 const candidates=(searchSummonPool||[]).map(id=>chars.find(c=>c.id===id)).filter(Boolean);

function splitNameReading(raw){
 const original=String(raw||'').trim().replace(/(?:\s*[（(]\s*[）)])+\s*$/u,'').trim();
 const m=original.match(/^(.*?)\s*[（(]([^（）()]+)[）)]\s*$/u);
 if(m){m[2]=m[2].normalize('NFKC');if(!/^[ぁ-ゖァ-ヿー・\s]+$/u.test(m[2])||/^(?:スーツ|メイド|ドレス|バニー|私服|制服|ロスト|サンタ|チャイナ|ウェディング|ハロウィン|クリスマス|リメイク|オルタ|アナザー)$/u.test(m[2].replace(/\s/g,'')))return null;}
 if(!m||!m[1].trim()||!/[ぁ-ゖァ-ヿ]/u.test(m[2]))return null;
 return {name:m[1].trim(),reading:m[2].trim()};
}
function applySplitToFields(nameInput,readingInput){
 if(!nameInput||!readingInput)return false;
 const parsed=splitNameReading(nameInput.value);
 if(!parsed||readingInput.value.trim()&&readingInput.value.trim()!==parsed.reading)return false;
 nameInput.value=parsed.name;readingInput.value=parsed.reading;return true;
}

async function loadIacharaTxt(event){
 const input=event.target, file=input.files&&input.files[0];
 if(!file)return;
 const status=document.getElementById('iacharaFileStatus');
 try{
  if(!/\.txt$/i.test(file.name)&&file.type!=='text/plain')throw Error('TXT形式のファイルを選んでください。');
  if(file.size>2*1024*1024)throw Error('2MB以下のテキストファイルを選んでください。');
  const bytes=await file.arrayBuffer();
  let content=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  if(!content.trim())throw Error('ファイルが空です。');
  const textarea=document.getElementById('iacharaText');
  if(!textarea)throw Error('入力画面が見つかりません。');
  if(textarea.value.trim()&&!confirm('入力欄のテキストを選択したファイルの内容で置き換えますか？'))return;
  textarea.value=content.replace(/^\uFEFF/,'');
  if(status)status.textContent='読み込み完了：'+file.name+'（内容を確認して「テキストから反映」を押してください）';
 }catch(err){if(status)status.textContent='読み込み失敗：'+err.message;alert('TXTファイルを読み込めませんでした：'+err.message)}
 finally{input.value=''}
}
function parseIachara(){let t=document.getElementById('iacharaText').value;if(!t.trim())return alert('テキストを貼り付けてください');let fields={name:/名前:\s*(.+)/,job:/職業:\s*(.+)/,age:/年齢:\s*([^\/\n]+)/,height:/身長:\s*([^\n]+)/};for(let [k,re] of Object.entries(fields)){let m=t.match(re);if(m){let el=document.querySelector(`[name="${k}"]`);if(el)el.value=m[1].trim()}}const heightField=document.querySelector('[name=height]');if(heightField&&sheetHeight(t))heightField.value=sheetHeight(t);const knowledge=sheetKnowledge(t);if(knowledge){const rawKnowledge=document.querySelector('[name=sheetKnowledge]');if(rawKnowledge&&!rawKnowledge.value.includes(knowledge))rawKnowledge.value=[rawKnowledge.value,knowledge].filter(Boolean).join('\n\n');const parts=splitRecordMemo(knowledge);for(const k of Object.keys(RECORD_FIELDS)){const el=document.querySelector('[name=record_'+k+']');if(el&&parts[k]&&!el.value.includes(parts[k]))el.value=[el.value,parts[k]].filter(Boolean).join('\n\n')}}splitEditorReading();const memoField=document.querySelector('[name=story]');const importedMemo=t.match(/【メモ】([\s\S]*)$/);if(memoField&&importedMemo&&!memoField.value.trim())memoField.value=importedMemo[1].trim();let stat=t.match(/【能力値】([\s\S]*?)(?:【技能値】|$)/);if(stat){for(let k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP']){let m=stat[1].match(new RegExp('^\\s*'+k+'\\s+(\\d+)','m'));let el=document.querySelector(`[name="${['HP','MP'].includes(k)?k.toLowerCase():'stat_'+k}"]`);if(m&&el)el.value=m[1]}}let san=t.match(/正気度\s+(\d+)\s*\/\s*(\d+)/);if(san){document.querySelector('[name=san]').value=san[1];document.querySelector('[name=sanMax]').value=san[2]}let section='';let count=0;let entries=[];for(let line of t.split(/\r?\n/)){let m=line.match(/『(戦闘技能|探索技能|行動技能|交渉技能|知識技能)』/);if(m){section=m[1];continue}if(!section)continue;let hit=line.match(/^\s*(.+?)\s{2,}(\d+)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s*$/);if(hit){entries.push(skillInput(hit[1].trim(),hit[2],hit[3]));count++}}if(count)document.getElementById('skillEditor').innerHTML=entries.join('');alert(`取り込みました（技能 ${count} 件）。内容を確認して「変更を保存する」を押してください。`)}

function parseIacharaRecord(t){
 const read=re=>{let m=t.match(re);return m?m[1].trim():''};
 const name=read(/(?:^|\n)名前[：:]\s*([^\r\n]+)/).replace(/(?:\s*[（(]\s*[）)])+\s*$/u,'').trim();
 if(!name)throw Error('名前の項目が見つかりません');
 const split=splitNameReading(name);
 const c={name:split?split.name:name,reading:split?split.reading:'',job:read(/(?:^|\n)職業[：:]\s*([^\r\n]+)/),age:read(/(?:^|\n)年齢[：:]\s*([^\/\r\n]+)/),height:sheetHeight(t),sheetKnowledge:sheetKnowledge(t),tag:'',bio:'',story:'',spoiler:'',image:'',jobTags:[],stats:{},skills:{},scenarios:[]};
 const stat=t.match(/【能力値】([\s\S]*?)(?:【技能値】|$)/);
 if(stat){for(const k of ['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP']){const m=stat[1].match(new RegExp('^\\s*'+k+'\\s+(\\d+)','m'));if(m){if(k==='HP'||k==='MP')c[k.toLowerCase()]=Number(m[1]);else c.stats[k]=Number(m[1]);}}}
 const san=t.match(/正気度\s+(\d+)\s*\/\s*(\d+)/);if(san){c.san=Number(san[1]);c.sanMax=Number(san[2]);}
 let section='';for(const line of t.split(/\r?\n/)){
  const sectionMatch=line.match(/『(戦闘技能|探索技能|行動技能|交渉技能|知識技能)』/);if(sectionMatch){section=sectionMatch[1];continue;}
  if(!section)continue;
  const hit=line.match(/^\s*(.+?)\s{2,}(\d+)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s*$/);
  if(hit)c.skills[hit[1].trim()]={value:Number(hit[2]),base:Number(hit[3])};
 }
 const memo=t.match(/【メモ】([\s\S]*)$/);if(memo)c.story=memo[1].trim();
 if(!Object.keys(c.stats).length&&!Object.keys(c.skills).length)throw Error('能力値・技能値を解析できませんでした（形式を確認してください）');
 return c;
}
async function readBulkTxt(event){

 const lines=[];
 for(const file of files){try{
  if(file.error)throw Error(file.error);if(!/\.txt$/i.test(file.name))throw Error('TXT形式ではありません');
  if(file.size>2*1024*1024)throw Error('2MBを超えています');
  const bytes=await file.arrayBuffer();const content=new TextDecoder('utf-8',{fatal:true}).decode(bytes).replace(/^\uFEFF/,'');

  lines.push(`<div class="panel"><b>✓ ${esc(file.name)}</b><p>${esc(c.name)} / ${esc(c.job||'職業未設定')} / 技能 ${Object.keys(c.skills).length} 件</p></div>`);
 }catch(err){lines.push(`<div class="panel"><b>✕ ${esc(file.name)}</b><p class="small">${esc(err.message)}</p></div>`);}}
 results.innerHTML=`<h2>読み込み結果：${bulkCandidates.length} / ${files.length} 件</h2>${lines.join('')}${bulkCandidates.length?'<button class="btn primary" onclick="commitBulkTxt()">確認した探索者をまとめて登録</button>':''}`;

}
async function commitBulkTxt(){

 if(!confirm(`${bulkCandidates.length}人の探索者を新規追加します。よろしいですか？`))return;

}

function settingsPage(){app.innerHTML=`<div class="small">LOCAL DATA MANAGEMENT</div><h1>保存とバックアップ</h1><div class="panel"><h2>この端末のデータ</h2><p>登録済み探索者：<b>${chars.length} 人</b></p><p class="notice">編集内容はこのブラウザのローカル保存領域に記録されます。ブラウザのデータ削除・端末変更・ファイルの開き方によって失われたり別データ扱いになる場合があります。定期的にJSONバックアップを保存してください。</p><div class="actions"><button class="btn primary" onclick="exportJson()">↓ JSONバックアップを保存</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ JSONを読み込む</button></div></div><div class="panel"><h2>キャラシ情報の一括補完</h2><p>ZIP・TXTから未登録のメモやプロフィールを補完します。</p><button class="btn primary" onclick="route('supplement')">一括補完を開く</button></div><div class="panel"><h2>タグ一括管理</h2><p>タグを選んで探索者をまとめて分類します。</p><button class="btn primary" onclick="route('bulkTags')">タグ一括管理を開く</button></div><div class="panel"><h2>立ち絵一括登録</h2><p>画像をまとめて探索者に振り分けます。</p><button class="btn primary" onclick="bulkArtPage()">立ち絵一括登録を開く</button></div><div class="panel"><h2>探索者の一括登録</h2><p>複数のいあきゃらTXTファイルをまとめて取り込みます。</p><button class="btn" onclick="bulkImportPage()">複数TXTを選んで登録</button></div><div class="panel"><h2>ふりがなの一括整理</h2><p>名前の末尾にある（読み）を、登録済み探索者もまとめて振り分けます。変更内容を確認してから保存します。</p><button class="btn" onclick="readingCleanupPage()">ふりがなの一括整理を開く</button></div><div class="panel"><h2>技能区分のカスタマイズ</h2><p>基本区分は維持したまま、技能ごとに表示先を変更できます。</p><button class="btn" onclick="categorySettingsPage()">技能区分を編集する</button></div><div class="panel"><h2>オフラインで使う</h2><p>このHTMLは外部の通信を必要としません。ダウンロードしてブラウザで開けば、ネット接続なしで利用できます。</p><p class="small">端末やブラウザによっては file:// での保存が制限される場合があります。その場合はJSONを書き出してデータを保管してください。</p></div><div class="panel"><h2>データを初期化</h2><button class="btn danger" onclick="resetAll()">探索者データをすべて削除</button></div>`}
function exportJson(){let blob=new Blob([JSON.stringify({format:'jinbutsucho-v1',exportedAt:new Date().toISOString(),characters:chars,skillPreferences:skillPrefs,skillCategoryOverrides:categoryOverrides},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='人物帖_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let arr=Array.isArray(data)?data:data.characters;if(!Array.isArray(arr)||!arr.every(c=>c&&typeof c==='object'&&typeof c.name==='string'&&typeof c.id==='string'&&c.id.length>0&&(!c.skills||typeof c.skills==='object'&&!Array.isArray(c.skills))))throw Error('人物帖のバックアップ形式ではありません');if(new Set(arr.map(c=>c.id)).size!==arr.length)throw Error('探索者IDが重複しています');if(!confirm(`探索者 ${arr.length} 人のデータで現在のデータを置き換えますか？`))return;let old=chars;chars=arr;if(!(await save())){chars=old;return}if(data.skillPreferences&&Array.isArray(data.skillPreferences.favorites)&&Array.isArray(data.skillPreferences.order)){skillPrefs=data.skillPreferences;saveSkillPrefs()}if(data.skillCategoryOverrides&&typeof data.skillCategoryOverrides==='object'&&!Array.isArray(data.skillCategoryOverrides)){categoryOverrides=data.skillCategoryOverrides;saveCategoryOverrides()}route('list');alert('読み込みました')}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}});
async function resetAll(){if(!confirm('この安定版の探索者データをすべて消しますか？'))return;let old=chars;chars=[];if(!(await save())){chars=old;return}route('list')}

// 思い出ギャラリー v1.6.8：画像を独立した記録にし、アルバムは画像IDの集合だけを保持する。
const MEMORY_DB='jinbutsucho_memories_v1';
let memoryPictures=[],memoryCollections=[],memoryMode='all',memoryQuery='',memoryTag='',memoryCurrentAlbum=null,memoryViewerItems=[],memoryViewerIndex=0,memoryBack='gallery';
function memoryId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,11)}
function memoryTags(v){return [...new Set((Array.isArray(v)?v.join(','):String(v||'')).split(/[,、，\n#＃]+/).map(x=>x.trim()).filter(Boolean))]}
function memorySafeId(id){return encodeURIComponent(id)}
function memoryDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(MEMORY_DB,2);req.onupgradeneeded=()=>{
 const db=req.result,tx=req.transaction;
 if(!db.objectStoreNames.contains('albums'))db.createObjectStore('albums',{keyPath:'id'});
 const pics=db.objectStoreNames.contains('pictures')?tx.objectStore('pictures'):db.createObjectStore('pictures',{keyPath:'id'});
 const collections=db.objectStoreNames.contains('collections')?tx.objectStore('collections'):db.createObjectStore('collections',{keyPath:'id'});
 // 旧アルバムの画像を画像単位へ変換。元データは削除せず保持する。
 const old=tx.objectStore('albums').getAll();
 old.onsuccess=()=>{for(const a of old.result||[]){
  const ids=[];(a.images||[]).forEach((im,i)=>{const id='legacy_'+a.id+'_'+i;ids.push(id);pics.put({id,data:im.data,title:im.caption||'',tags:memoryTags([...memoryTags(a.tags),...memoryTags(im.tags)]),scenario:a.scenario||'',period:a.period||'',members:a.members||'',memo:im.memo||a.memo||'',createdAt:a.createdAt||new Date().toISOString(),updatedAt:a.updatedAt||new Date().toISOString()})});
  collections.put({id:'legacy_album_'+a.id,title:a.title||'無題のアルバム',pictureIds:ids,createdAt:a.createdAt||new Date().toISOString(),updatedAt:a.updatedAt||new Date().toISOString()});
 }};
};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function memoryGetAll(store){const db=await memoryDb();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly'),r=tx.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close();tx.onerror=()=>reject(tx.error)})}
async function memoryPut(store,obj){const db=await memoryDb();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function memoryDelete(store,id){const db=await memoryDb();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function memoryReload(){memoryPictures=await memoryGetAll('pictures');memoryCollections=await memoryGetAll('collections')}
function memoryPicture(id){return memoryPictures.find(p=>p.id===id)}
function memoryAlbum(id){return memoryCollections.find(a=>a.id===id)}
function memoryAlbumsFor(id){return memoryCollections.filter(a=>(a.pictureIds||[]).includes(id))}
function memoryMatch(p){const q=memoryQuery.trim().toLocaleLowerCase('ja');return (!memoryTag||memoryTags(p.tags).includes(memoryTag))&&(!q||[p.title,p.scenario,p.period,p.members,p.memo,...memoryTags(p.tags),...memoryAlbumsFor(p.id).map(a=>a.title)].join(' ').toLocaleLowerCase('ja').includes(q))}
function memorySorted(arr){return [...arr].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}
function memoryTagChoices(){const m=new Map();for(const p of memoryPictures)for(const t of memoryTags(p.tags))m.set(t,(m.get(t)||0)+1);return [...m].sort((a,b)=>b[1]-a[1]).slice(0,24)}
async function galleryAlbumsPage(){app.innerHTML='<h1>思い出</h1><div class="panel">読み込み中…</div>';try{await memoryReload();memoryDrawAlbums()}catch(e){app.innerHTML=`<h1>思い出</h1><div class="notice">ギャラリーを開けませんでした：${esc(e.message)}</div>`}}
function memoryDrawAlbums(){
 app.innerHTML=`<div class="small">MEMORY GALLERY / ${memoryPictures.length} IMAGES</div><h1>思い出</h1>
 <div class="actions"><button class="btn primary" onclick="document.getElementById('memoryUpload').click()">＋ イラストを追加</button><button class="btn" onclick="memoryCreateAlbum()">＋ アルバム</button><button class="btn" onclick="memoryBackupPage()">バックアップ</button></div>
 <div class="panel" style="margin-top:12px"><b>✦ 思い出との再会</b><p class="small">今表示している検索条件のイラストから、ランダムで出会います。1回・10連とも全画像が同じ確率です。</p><div class="memory-gacha-actions"><button class="btn primary" onclick="memoryDrawGacha(1)">✦ 1回引く</button><button class="btn primary" onclick="memoryDrawGacha(10)">✦ 10連で出会う</button></div><details style="margin-top:12px"><summary>📱 NFC・QRで思い出ガチャを起動</summary><p class="small">1回・10連それぞれの起動用リンクを作れます。登録した画像はこの端末の人物帖から抽選されます。</p><div class="memory-gacha-actions"><button class="btn" onclick="memoryShowGachaQR(1)">1回のQRを表示</button><button class="btn" onclick="memoryShowGachaQR(10)">10連のQRを表示</button><button class="btn" onclick="memoryCopyGachaLink(1)">1回のNFC用URL</button><button class="btn" onclick="memoryCopyGachaLink(10)">10連のNFC用URL</button></div></details></div>
 <input hidden type="file" id="memoryUpload" accept="image/jpeg,image/png,image/webp" multiple onchange="memoryUpload(event)">
 <p id="memoryUploadStatus" class="small"></p>
 <div class="tabs"><button class="btn ${memoryMode==='all'?'primary':''}" onclick="memoryMode='all';memoryRenderResults()">すべての画像</button><button class="btn ${memoryMode==='albums'?'primary':''}" onclick="memoryMode='albums';memoryDrawAlbums()">アルバム</button></div>
 <label class="field"><span>イラスト名・タグ・シナリオ・メモで検索</span><input id="memorySearch" value="${esc(memoryQuery)}" placeholder="例：VOID / 自陣 / エンドカード" oninput="memoryQuery=this.value;memoryRenderResults()"></label>
 <div class="actions" id="memoryTagBar"></div><div id="memoryResults"></div>`;
 memoryRenderResults();
}
function memoryRenderResults(){
 const host=document.getElementById('memoryResults');if(!host)return;
 const bar=document.getElementById('memoryTagBar');if(bar)bar.innerHTML=memoryTagChoices().map(([t,n])=>`<button class="btn ${memoryTag===t?'primary':''}" style="padding:6px 9px;font-size:12px" onclick="memoryChooseTag(decodeURIComponent('${encodeURIComponent(t)}'))">#${esc(t)} (${n})</button>`).join('')+(memoryTag?'<button class="btn" onclick="memoryChooseTag(\'\')">解除 ×</button>':'');
 const tabs=document.querySelector('.tabs');if(tabs)tabs.innerHTML=`<button class="btn ${memoryMode==='all'?'primary':''}" onclick="memoryMode='all';memoryDrawAlbums()">すべての画像</button><button class="btn ${memoryMode==='albums'?'primary':''}" onclick="memoryMode='albums';memoryDrawAlbums()">アルバム</button>`;
 if(memoryMode==='albums'){
  const albums=memoryCollections.filter(a=>!memoryQuery.trim()&&!memoryTag||a.title.toLocaleLowerCase('ja').includes(memoryQuery.trim().toLocaleLowerCase('ja'))&&!memoryTag||(a.pictureIds||[]).some(id=>{const p=memoryPicture(id);return p&&memoryMatch(p)}));
  host.innerHTML=`<div class="memory-albums">${memorySorted(albums).map(a=>{const p=(a.pictureIds||[]).map(memoryPicture).find(Boolean);return `<button class="memory-album" onclick="memoryOpenAlbum(decodeURIComponent('${memorySafeId(a.id)}'))">${p?`<img class="memory-cover" src="${esc(p.data)}" alt="">`:'<div class="memory-cover">📁</div>'}<div class="memory-album-body"><strong>${esc(a.title)}</strong><div class="small">${(a.pictureIds||[]).filter(id=>memoryPicture(id)).length}枚</div></div></button>`}).join('')}</div>${albums.length?'':'<div class="empty">アルバムはまだありません</div>'}`;return;
 }
 const pics=memorySorted(memoryPictures.filter(memoryMatch));host.innerHTML=`<p class="small">${pics.length}枚のイラスト</p><div class="memory-grid">${pics.map(p=>`<button class="memory-tile" onclick="memoryOpenImage(decodeURIComponent('${memorySafeId(p.id)}'))" title="${esc(p.title||'イラスト')}"><img loading="lazy" src="${esc(p.data)}" alt="${esc(p.title||'イラスト')}"></button>`).join('')}</div>${pics.length?'':'<div class="empty">イラストがありません。「＋ イラストを追加」から画像を登録できます。</div>'}`;
}
function memoryChooseTag(t){memoryTag=memoryTag===t?'':t;memoryRenderResults()}
async function memoryConvertImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPEG・PNG・WebPのみ対応しています');if(file.size>25*1024*1024)throw Error('25MBを超える画像は追加できません');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('画像を開けません'));im.src=url});const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return {data:canvas.toDataURL('image/webp',.83),title:file.name.replace(/\.[^.]+$/,'')}}finally{URL.revokeObjectURL(url)}}
async function memoryUpload(e){const files=[...(e.target.files||[])];if(!files.length)return;const status=document.getElementById('memoryUploadStatus');if(status)status.textContent='画像を保存しています…';let n=0,errors=[];for(const f of files){try{const pic=await memoryConvertImage(f);await memoryPut('pictures',{id:memoryId(),...pic,tags:[],scenario:'',period:'',members:'',memo:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});n++}catch(err){errors.push(f.name+'：'+err.message)}}await memoryReload();memoryDrawAlbums();if(errors.length)alert(n+'枚保存しました。失敗：'+errors.join(' / '));e.target.value=''}

r:#f4b77d}.nameplate h2{font-size:clamp(27px,7vw,37px);margin:7px 0;letter-spacing:.14em}.nameplate p{font-size:12px;color:#e0c7ae;margin:0}.corner{position:absolute;z-index:17;font:9px monospace;letter-spacing:.14em;color:#b98762}.corner.a{top:16px;left:15px}.corner.b{bottom:14px;right:13px}.status{font:11px monospace;letter-spacing:.12em;text-align:center;color:#d9b189;margin:10px 0}.buttons{display:flex;gap:8px;margin-top:11px}button,.upload{border:1px solid #8a6048;border-radius:9px;background:#201819;color:#f6e4cf;padding:13px 10px;font:inherit;cursor:pointer}.buttons button{flex:1}button.primary{background:#d4a26b;color:#21120e;font-weight:800}.settings{margin-top:13px;border:1px solid #4a3931;border-radius:12px;padding:12px;display:grid;gap:10px}.settings label{font-size:12px;color:#d5b9a0}.settings input[type=text]{width:100%;padding:11px;border:1px solid #695044;background:#120f12;color:white;border-radius:7px;font:inherit}.upload{display:block;text-align:center;font-size:12px}.upload input{display:none}.note{font-size:11px;line-height:1.7;color:#bba99d;margin-top:10px}.stage.play .ambient{animation:ambient 7s both}.stage.play .sigilwrap{animation:appear 1.3s .2s both,implode 1s 5.0s both}.stage.play .glyph{animation:trace 1.25s var(--delay) ease-out both,burn 1.3s calc(var(--delay) + 2.25s) ease-in both}.stage.play .glyph.eye{animation:trace 1.1s 1.65s both,eyeburn 1.35s 4.25s both}.stage.play .ringA{animation:accelerateA 5.15s 1s linear both}.stage.play .ringB{animation:accelerateB 5.15s 1s linear both}.stage.play .ringC{animation:accelerateC 5.15s 1s linear both}.stage.play .light{animation:beam 1.15s 5.45s both}.stage.play .burst{animation:blast 1.15s 5.8s both}.stage.play .figurewrap{animation:reveal 1.5s 6.1s both}.stage.play .floor{animation:floor .9s 5.7s both}.stage.play .nameplate{animation:namereveal .9s 7.1s both}.stage.play .eyeoverlay{animation:eyeflash .7s 4.9s both}@keyframes ambient{10%,90%{opacity:1}100%{opacity:.45}}@keyframes appear{to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}@keyframes implode{0%{opacity:1}100%{opacity:0;filter:brightness(4) blur(12px);transform:translate(-50%,-50%) scale(1.5) rotate(18deg)}}@keyframes trace{to{stroke-dashoffset:0}}@keyframes burn{0%{stroke:#f5bd75;stroke-dashoffset:0;filter:drop-shadow(0 0 3px #f60)}35%{stroke:#fff0c6;filter:drop-shadow(0 0 12px #ff6d00)}65%{stroke:#ff581e;filter:drop-shadow(0 0 15px #f40)}100%{stroke:#332c2b;stroke-dashoffset:var(--len);opacity:0;filter:blur(3px)}}@keyframes eyeburn{0%{stroke-dashoffset:0}45%{stroke:#fff;filter:drop-shadow(0 0 18px #ff4500)}100%{opacity:0;stroke-dashoffset:var(--len)}}@keyframes accelerateA{0%{transform:rotate(0deg)}20%{transform:rotate(25deg)}40%{transform:rotate(100deg)}60%{transform:rotate(280deg)}80%{transform:rotate(660deg)}100%{transform:rotate(1320deg)}}@keyframes accelerateB{0%{transform:rotate(0deg)}20%{transform:rotate(-35deg)}40%{transform:rotate(-145deg)}60%{transform:rotate(-410deg)}80%{transform:rotate(-970deg)}100%{transform:rotate(-1890deg)}}@keyframes accelerateC{0%{transform:rotate(0deg)}20%{transform:rotate(45deg)}40%{transform:rotate(190deg)}60%{transform:rotate(540deg)}80%{transform:rotate(1260deg)}100%{transform:rotate(2520deg)}}@keyframes beam{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.1)}50%{opacity:1;transform:translate(-50%,-50%) scaleX(3)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(12)}}@keyframes blast{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(2)}}@keyframes reveal{0%{opacity:0;transform:translateY(40px) scale(.82);filter:brightness(0) drop-shadow(0 0 30px #f80)}45%{opacity:1;filter:brightness(3) drop-shadow(0 0 40px #f80)}100%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}@keyframes floor{to{opacity:1}}@keyframes namereveal{to{opacity:1;transform:translateY(0)}}@keyframes eyeflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}@media(prefers-reduced-motion:reduce){.stage.play .sigilwrap{display:none}.stage.play .figurewrap,.stage.play .nameplate{animation-duration:.1s;animation-delay:.2s}}\n\nhtml,body{height:100%;overflow:hidden;background:#07080a}.app{padding:0;max-width:none;height:100%;display:block}.top,.controls,.note,.actions,.hint,.footer{display:none!important}.stage{width:100vw;height:100dvh;min-height:0;max-height:none;border:0;border-radius:0}.figurewrap,.nameplate{display:block}\n\u003c/style>\u003cstyle>\nhtml,body{width:100%;height:100%;overflow:hidden!important;background:transparent!important}\n.app{max-width:none!important;padding:0!important;width:100%;height:100%}\n.top,.controls,.panel,.bottom,.kicker,h1,.pill,#play,#skip{display:none!important}\n.stage{width:100%;height:100dvh!important;min-height:0!important;border:0!important;border-radius:0!important;background:radial-gradient(ellipse at center,#171c29 0%,#070910 75%)!important;box-shadow:none!important}\n.sigilwrap{width:min(96vw,76dvh,540px)!important;top:48%!important;filter:drop-shadow(0 0 3px #ffffff88)!important}\n.glyph,.glyph.eye{stroke:#fff!important;filter:drop-shadow(0 0 1px #ffffff66)!important}\n.figurewrap,.nameplate,.placeholder,.floor{display:none!important}\n.ambient{background:radial-gradient(circle,#ffffff44,transparent 55%)!important}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain class=\"app\">\u003cdiv class=\"top\">\u003cdiv>\u003cdiv class=\"kicker\">PERSONAL ARCHIVE / SUMMON PROTOCOL\u003c/div>\u003ch1>\u65e7\u304d\u5370\u306e\u708e \u003cspan style=\"font-size:11px;color:#c9956a\">DELUXE\u003c/span>\u003c/h1>\u003c/div>\u003cdiv class=\"pill\">ELDER SEAL\u003c/div>\u003c/div>\u003cdiv class=\"stage\" id=\"stage\">\u003cdiv class=\"ambient\">\u003c/div>\u003cdiv class=\"corner a\">RITUAL SEQUENCE // 07\u003c/div>\u003cdiv class=\"corner b\">ARCHIVE // UNSEALED\u003c/div>\u003ccanvas class=\"canvas\" id=\"flames\">\u003c/canvas>\u003ccanvas class=\"canvas\" id=\"particles\">\u003c/canvas>\u003cdiv class=\"floor\">\u003c/div>\u003cdiv class=\"sigilwrap\">\u003csvg class=\"sigil\" viewBox=\"0 0 400 400\" id=\"sigil\" aria-label=\"\u4e94\u8292\u661f\u3068\u773c\u306e\u5e7e\u4f55\u5b66\u7684\u306a\u53ec\u559a\u9663\">\u003cg class=\"ringA\">\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"184\"/>\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"175\"/>\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"166\"/>\u003cpath class=\"glyph\" d=\"M200 16V34 M200 366V384 M16 200H34 M366 200H384 M70 70l15 15 M315 315l15 15 M70 330l15 -15 M315 85l15 -15\"/>\u003c/g>\u003cg class=\"ringB\">\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"152\"/>\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"138\"/>\u003cpath class=\"glyph\" d=\"M200 48L332 276L68 276Z M200 352L68 124L332 124Z\"/>\u003c/g>\u003cg class=\"ringC\">\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"119\"/>\u003cpath class=\"glyph major\" d=\"M200 89 L265.2 289.5 L94.5 165.5 L305.5 165.5 L134.8 289.5 Z\"/>\u003cpath class=\"glyph\" d=\"M200 102L287 263L112 263Z M200 298L112 137L287 137Z\"/>\u003c/g>\u003cg>\u003ccircle class=\"glyph\" cx=\"200\" cy=\"200\" r=\"78\"/>\u003cpath class=\"glyph eye\" d=\"M134 200 Q200 138 266 200 Q200 262 134 200Z\"/>\u003ccircle class=\"glyph eye\" cx=\"200\" cy=\"200\" r=\"25\"/>\u003ccircle class=\"glyph eye\" cx=\"200\" cy=\"200\" r=\"10\"/>\u003cpath class=\"glyph eye\" d=\"M200 147V158 M200 242V253 M128 200H140 M260 200H272\"/>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv class=\"eyeoverlay\">\u003c/div>\u003cdiv class=\"light\">\u003c/div>\u003cdiv class=\"figurewrap\" id=\"figure\">\u003cdiv class=\"placeholder\" id=\"placeholder\">\u003c/div>\u003cimg id=\"portrait\" alt=\"\u63a2\u7d22\u8005\u306e\u7acb\u3061\u7d75\" hidden>\u003c/div>\u003cdiv class=\"burst\">\u003c/div>\u003cdiv class=\"nameplate\">\u003cdiv class=\"sub\">INVESTIGATOR MANIFESTED\u003c/div>\u003ch2 id=\"displayName\">UNKNOWN\u003c/h2>\u003cp id=\"displayTitle\">\u5c01\u5370\u3055\u308c\u305f\u8a18\u9332\u304c\u3001\u3044\u307e\u89e3\u304b\u308c\u308b\u3002\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"status\" id=\"status\">READY // TAP TO INITIATE\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton class=\"primary\" id=\"play\">\u2726 \u53ec\u559a\u3092\u958b\u59cb\u003c/button>\u003cbutton id=\"skip\">\u30b9\u30ad\u30c3\u30d7\u003c/button>\u003c/div>\u003cdiv class=\"settings\">\u003clabel>\u63a2\u7d22\u8005\u540d\u003cinput type=\"text\" id=\"name\" value=\"\u63a2\u7d22\u8005\u306e\u540d\u524d\" maxlength=\"30\">\u003c/label>\u003clabel>\u79f0\u53f7\u30fb\u7d39\u4ecb\u6587\u003cinput type=\"text\" id=\"title\" value=\"\u5c01\u5370\u3055\u308c\u305f\u8a18\u9332\u304c\u3001\u3044\u307e\u89e3\u304b\u308c\u308b\u3002\" maxlength=\"80\">\u003c/label>\u003clabel class=\"upload\">\uff0b \u7acb\u3061\u7d75PNG\u3092\u9078\u629e\uff08\u7aef\u672b\u5185\u3067\u30d7\u30ec\u30d3\u30e5\u30fc\uff09\u003cinput type=\"file\" id=\"file\" accept=\"image/png,image/webp,image/jpeg\">\u003c/label>\u003c/div>\u003cp class=\"note\">\u72ec\u7acb\u3057\u305f\u6f14\u51fa\u8a66\u4f5c\u7248\u3067\u3059\u3002\u4eba\u7269\u5e16\u306e\u4fdd\u5b58\u30c7\u30fc\u30bf\u306f\u5909\u66f4\u3057\u307e\u305b\u3093\u3002\u7acb\u3061\u7d75\u306f\u3053\u306e\u30da\u30fc\u30b8\u5185\u3067\u306e\u307f\u8aad\u307f\u8fbc\u307f\u3001\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u3055\u308c\u307e\u305b\u3093\u3002NFC\u9023\u643a\u30fb\u4eba\u7269\u5e16\u9023\u52d5\u306f\u672a\u5b9f\u88c5\u3067\u3059\u3002\u97f3\u58f0\u306a\u3057\u3067\u518d\u751f\u3067\u304d\u307e\u3059\u3002\u9b54\u6cd5\u9663\u306e\u7dda\u3092\u706b\u304c\u8d70\u308a\u3001\u71c3\u3048\u305f\u7b87\u6240\u304b\u3089\u5c0f\u3055\u306a\u708e\u3068\u7070\u304c\u751f\u307e\u308c\u307e\u3059\u3002\u003c/p>\u003c/main>\u003cscript>\nconst stage=document.getElementById('stage'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),flameCanvas=document.getElementById('flames'),fx=flameCanvas.getContext('2d');let particles=[],start=0,raf=0,playing=false;const glyphs=[...document.querySelectorAll('.glyph')];glyphs.forEach((el,i)=>{let len=el.getTotalLength?.()||1000;el.style.setProperty('--len',len);el.style.setProperty('--delay',(0.35+i*.105)+'s')});let W=0,H=0,dpr=1;function resize(){let r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);flameCanvas.width=W*dpr;flameCanvas.height=H*dpr;fx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();\n// SVG path geometry is sampled in screen space, so flames remain attached\n// to the actual rotating lines rather than appearing at random positions.\nconst paths=glyphs.map((el,i)=>({el,i,len:el.getTotalLength(),delay:el.classList.contains('eye')?1.65:.35+i*.105,eye:el.classList.contains('eye')}));\nlet flames=[],lastT=0;\nfunction pointOnPath(item,fraction){\n  const p=item.el.getPointAtLength(Math.max(0,Math.min(item.len,item.len*fraction)));\n  const m=item.el.getScreenCTM(),rect=flameCanvas.getBoundingClientRect();\n  if(!m)return null;\n  return {x:m.a*p.x+m.c*p.y+m.e-rect.left,y:m.b*p.x+m.d*p.y+m.f-rect.top};\n}\nfunction makeFlame(x,y,tangentX,tangentY,power=1){\n const n=Math.hypot(tangentX,tangentY)||1;\n const dx=tangentX/n,dy=tangentY/n;\n flames.push({x,y,vx:dx*(.2+Math.random()*.5)+(Math.random()-.5)*.35,\n vy:-.65-Math.random()*.65,life:15+Math.random()*15,max:30,\n size:(2+Math.random()*3)*power,phase:Math.random()*6.28});\n}\nfunction fire(t){\n fx.clearRect(0,0,W,H);\n if(t\u003c1.4||t>6.45){flames=[];return}\n fx.save();fx.globalCompositeOperation='lighter';\n // A thin ignition front moves along each individual stroke.\n for(const item of paths){\n   const ignition=item.eye?4.25:item.delay+2.25;\n   const duration=item.eye?1.35:1.3;\n   const progress=(t-ignition)/duration;\n   if(progress\u003c0||progress>1.08)continue;\n   const front=Math.max(0,Math.min(1,progress));\n   const p=pointOnPath(item,front);\n   if(!p)continue;\n   const prev=pointOnPath(item,Math.max(0,front-.015))||p;\n   // Bright hot tip clings to the line.\n   const halo=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,12);\n   halo.addColorStop(0,'rgba(255,255,224,.9)');\n   halo.addColorStop(.22,'rgba(255,180,65,.72)');\n   halo.addColorStop(1,'rgba(255,70,15,0)');\n   fx.fillStyle=halo;fx.beginPath();fx.arc(p.x,p.y,12,0,Math.PI*2);fx.fill();\n   // Short flames trail the ignition front, rather than random flames everywhere.\n   for(let j=0;j\u003c3;j++){\n     const q=pointOnPath(item,Math.max(0,front-j*.025));\n     if(q&&Math.random()\u003c.65)makeFlame(q.x,q.y,p.x-prev.x,p.y-prev.y,j===0?1.2:.75);\n   }\n   if(Math.random()\u003c.8)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*1.3,vy:-.4-Math.random()*1.4,life:25+Math.random()*35,max:60,size:.25+Math.random()*.7,ash:false,color:Math.random()\u003c.5?'#ffb35c':'#ff6c25'});\n   if(progress>.42&&Math.random()\u003c.35){\n     const ashP=pointOnPath(item,Math.random()*front);\n     if(ashP)particles.push({x:ashP.x,y:ashP.y,vx:(Math.random()-.5)*.9,vy:-.15-Math.random()*.5,life:35+Math.random()*45,max:80,size:.3+Math.random()*.7,ash:true,color:'#938b83'});\n   }\n }\n flames=flames.filter(f=>f.life-->0);\n for(const f of flames){\n   f.x+=f.vx;f.y+=f.vy;f.vx+=Math.sin(t*9+f.phase)*.055;\n   const alpha=Math.min(1,f.life/10)*Math.min(1,(f.max-f.life)/5);\n   const h=f.size*(2.4+Math.sin(t*12+f.phase)*.35);\n   const grad=fx.createLinearGradient(f.x,f.y,f.x+f.vx*3,f.y-h);\n   grad.addColorStop(0,`rgba(255,240,166,${.85*alpha})`);\n   grad.addColorStop(.4,`rgba(255,117,24,${.8*alpha})`);\n   grad.addColorStop(1,'rgba(190,25,5,0)');\n   fx.fillStyle=grad;\n   fx.beginPath();fx.moveTo(f.x-f.size*.48,f.y);\n   fx.quadraticCurveTo(f.x-f.size*.7,f.y-h*.55,f.x+f.vx*3,f.y-h);\n   fx.quadraticCurveTo(f.x+f.size*.7,f.y-h*.48,f.x+f.size*.48,f.y);\n   fx.closePath();fx.fill();\n }\n fx.restore();\n}\nfunction spawn(t){\n // Smal let memoryRitualTimer=null,memoryRitualCleanupTimer=null;
function memoryStopRitual(){
 if(memoryRitualTimer!==null){clearTimeout(memoryRitualTimer);memoryRitualTimer=null;}
 if(memoryRitualCleanupTimer!==null){clearTimeout(memoryRitualCleanupTimer);memoryRitualCleanupTimer=null;}
 document.getElementById('memoryRitualScreen')?.remove();
}
function memoryFinishRitual(){
 if(memoryRitualTimer!==null){clearTimeout(memoryRitualTimer);memoryRitualTimer=null;}
 const layer=document.getElementById('memoryRitualScreen');
 // Render the illustration first, underneath the circle. Both remain on screen
 // during the flash, rather than cutting to a separate black frame.
 memoryShowGachaResults();
 const results=document.getElementById('memoryGachaOverlay');
 if(results){
  results.classList.remove('memory-appearing','memory-settled');
  void results.offsetWidth;
  results.classList.add('memory-appearing');
 }
 if(!layer)return;
 layer.classList.add('memory-revealing');
 memoryRitualCleanupTimer=setTimeout(()=>{
  // Lock the result at its final pose before removing the temporary
  // animation class. Otherwise the original card reveal restarts and jolts.
  if(results){
   results.classList.add('memory-settled');
   results.classList.remove('memory-appearing');
  }
  layer.remove();
  memoryRitualCleanupTimer=null;
 },960);
}

function memoryGachaRandomIndex(length){

  const a=new Uint32Array(1),limit=Math.floor(4294967296/length)*length;
  do{crypto.getRandomValues(a)}while(a[0]>=limit);
  return a[0]%length;

}

function memoryCreateAlbum(id){const a=id?memoryAlbum(id):null;app.innerHTML=`<button class="btn" onclick="${id?`memoryOpenAlbum(decodeURIComponent('${memorySafeId(id)}'))`:'memoryDrawAlbums()'}">← 戻る</button><h1>${a?'アルバム名を変更':'アルバムを作る'}</h1><div class="panel"><label class="field"><span>アルバム名</span><input id="albumTitle" value="${esc(a?.title||'')}" placeholder="例：VOIDの思い出"></label><button class="btn primary" onclick="memorySaveCollection(${id?`decodeURIComponent('${memorySafeId(id)}')`:'null'})">保存</button></div>`}
async function memorySaveCollection(id){const title=document.getElementById('albumTitle').value.trim();if(!title)return alert('アルバム名を入力してください');const old=id?memoryAlbum(id):null;const a={id:old?.id||memoryId(),title,pictureIds:old?.pictureIds||[],createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};try{await memoryPut('collections',a);await memoryReload();memoryOpenAlbum(a.id)}catch(e){alert('保存できませんでした：'+e.message)}}
function memoryOpenAlbum(id){const a=memoryAlbum(id);if(!a)return;memoryCurrentAlbum=id;const pics=(a.pictureIds||[]).map(memoryPicture).filter(Boolean);app.innerHTML=`<button class="btn" onclick="memoryCurrentAlbum=null;memoryMode='albums';memoryDrawAlbums()">← アルバム一覧</button><h1>${esc(a.title)}</h1><div class="actions"><button class="btn primary" onclick="memorySelectAlbumPictures(decodeURIComponent('${memorySafeId(id)}'))">＋ 登録済み画像を選ぶ</button><button class="btn" onclick="memoryCreateAlbum(decodeURIComponent('${memorySafeId(id)}'))">名前変更</button><button class="btn danger" onclick="memoryRemoveCollection(decodeURIComponent('${memorySafeId(id)}'))">削除</button></div><div class="memory-gacha-actions"><button class="btn primary" onclick="memoryDrawGacha(1,decodeURIComponent('${memorySafeId(id)}'))">✦ このアルバムから1回</button><button class="btn primary" onclick="memoryDrawGacha(10,decodeURIComponent('${memorySafeId(id)}'))">✦ このアルバムから10連</button></div><details><summary>📱 このアルバム専用 NFC・QR</summary><div class="memory-gacha-actions"><button class="btn" onclick="memoryShowGachaQR(1,decodeURIComponent('${memorySafeId(id)}'))">1回のQR</button><button class="btn" onclick="memoryShowGachaQR(10,decodeURIComponent('${memorySafeId(id)}'))">10連のQR</button><button class="btn" onclick="memoryCopyGachaLink(1,decodeURIComponent('${memorySafeId(id)}'))">1回のURL</button><button class="btn" onclick="memoryCopyGachaLink(10,decodeURIComponent('${memorySafeId(id)}'))">10連のURL</button></div></details><p class="small">${pics.length}枚 · アルバムを削除してもイラストは残ります</p><div class="memory-grid">${pics.map(p=>`<button class="memory-tile" onclick="memoryOpenImage(decodeURIComponent('${memorySafeId(p.id)}'),decodeURIComponent('${memorySafeId(id)}'))"><img loading="lazy" src="${esc(p.data)}" alt="${esc(p.title||'イラスト')}"></button>`).join('')}</div>${pics.length?'':'<div class="empty">画像を選んで入れられます</div>'}`}
function memorySelectAlbumPictures(id){const a=memoryAlbum(id);if(!a)return;const selected=new Set(a.pictureIds||[]);app.innerHTML=`<button class="btn" onclick="memoryOpenAlbum(decodeURIComponent('${memorySafeId(id)}'))">← 戻る</button><h1>アルバムに入れる画像</h1><p class="small">登録済みの画像を選択してください。画像そのものは移動・複製されません。</p><div class="memory-grid">${memorySorted(memoryPictures).map(p=>`<label style="position:relative;display:block"><img src="${esc(p.data)}" alt="${esc(p.title||'')}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px"><input class="albumPick" type="checkbox" value="${esc(p.id)}" ${selected.has(p.id)?'checked':''} style="position:absolute;top:8px;left:8px;width:23px;height:23px"></label>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="memorySaveAlbumSelection(decodeURIComponent('${memorySafeId(id)}'))">選択を保存</button></div>`}
async function memorySaveAlbumSelection(id){const a=memoryAlbum(id);if(!a)return;const ids=[...document.querySelectorAll('.albumPick:checked')].map(x=>x.value);try{await memoryPut('collections',{...a,pictureIds:ids,updatedAt:new Date().toISOString()});await memoryReload();memoryOpenAlbum(id)}catch(e){alert('保存できませんでした：'+e.message)}}
async function memoryRemoveCollection(id){const a=memoryAlbum(id);if(!a||!confirm('「'+a.title+'」を削除しますか？中のイラストは削除されません。'))return;try{await memoryDelete('collections',id);await memoryReload();memoryCurrentAlbum=null;memoryMode='albums';memoryDrawAlbums()}catch(e){alert('削除できませんでした：'+e.message)}}
function memoryDownload(data,name){const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function memoryBackupPage(){app.innerHTML=`<button class="btn" onclick="memoryDrawAlbums()">← 思い出へ</button><h1>思い出のバックアップ</h1><div class="panel"><p>画像・画像の情報・アルバムをまとめて保存します。探索者の通常のバックアップとは別です。</p><button class="btn primary" onclick="memoryExportBackup()">↓ 思い出を保存（JSON）</button></div><div class="panel"><h2>復元</h2><p>新形式のバックアップに加え、旧v1.6.5・v1.6.6のアルバムバックアップも読み込めます。同じIDのデータは上書きされます。</p><input type="file" accept=".json,application/json" onchange="memoryImportBackup(event)"></div>`}
async function memoryExportBackup(){try{await memoryReload();memoryDownload({format:'jinbutsucho-memory-v2',exportedAt:new Date().toISOString(),pictures:memoryPictures,collections:memoryCollections},'人物帖_思い出_'+new Date().toISOString().slice(0,10)+'.json')}catch(e){alert('書き出せませんでした：'+e.message)}}
async function memoryImportBackup(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());let pics=[],albums=[];if(data.format==='jinbutsucho-memory-v2'){pics=data.pictures;albums=data.collections}else if(data.format==='jinbutsucho-memory-v1'&&Array.isArray(data.albums)){for(const a of data.albums){const ids=[];(a.images||[]).forEach((im,i)=>{const id='legacy_'+a.id+'_'+i;ids.push(id);pics.push({id,data:im.data,title:im.caption||'',tags:memoryTags([...memoryTags(a.tags),...memoryTags(im.tags)]),scenario:a.scenario||'',period:a.period||'',members:a.members||'',memo:im.memo||a.memo||'',createdAt:a.createdAt||new Date().toISOString()})});albums.push({id:'legacy_album_'+a.id,title:a.title,pictureIds:ids,createdAt:a.createdAt||new Date().toISOString()})}}else throw Error('対応していないバックアップです');if(!Array.isArray(pics)||!Array.isArray(albums)||!pics.every(p=>p&&typeof p.id==='string'&&/^data:image\/(webp|png|jpeg);base64,/.test(p.data))||!albums.every(a=>a&&typeof a.id==='string'&&typeof a.title==='string'&&Array.isArray(a.pictureIds)))throw Error('データ形式が不正です');if(!confirm(pics.length+'枚のイラストと'+albums.length+'冊のアルバムを復元しますか？'))return;for(const p of pics)await memoryPut('pictures',p);for(const a of albums)await memoryPut('collections',a);await memoryReload();memoryDrawAlbums();alert('復元しました')}catch(err){alert('復元に失敗しました：'+err.message)}finally{e.target.value=''}}

(async()=>{const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:99999;background:#101018;display:grid;place-items:center;color:white';shield.textContent='探索者データを読み込み中…';document.body.append(shield);try{await load();render();shield.remove();handleIncomingSummon();handleIncomingMemoryGacha()}catch(e){shield.textContent='保存データを読み込めませんでした。データを消さずにページを再読み込みしてください。';console.error(e)}})();
